const WEATHER_MULTIPLIERS = { clear: 1.0, rain: 1.15, snow: 1.3, fog: 1.1 };
const normStr = (s) => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();

function getChertezhnikVariants(raw, catalog = DEFAULT_CHERTEZHNIK_CATALOG) {
  const q = normStr(raw);
  if (!q) return [];
  for (const item of catalog) {
    if (item.keys.some((k) => q.includes(k) || k.includes(q))) {
      return item.variants;
    }
  }
  const fallbackAreas = [
    "Бишкек — Свердловский район",
    "Бишкек — Первомайский район",
    "Бишкек — Октябрьский район",
    "Бишкек — Ленинский район",
    "Бишкек — Ак-Орго",
    "Чуйская обл. — Покровка",
    "Чуйская обл. — Кант",
  ];
  return fallbackAreas.map((area, i) => ({
    area,
    address: raw.trim(),
    coords: [42.87 + i * 0.004, 74.60 + i * 0.015],
    basePrice: 250 + i * 25,
  }));
}

function calcChertezhnikRoute({ rawA, rawB, selectedA, selectedB, catalog, traffic = "1.0", weather = "clear", clientPhone = "" }) {
  const cleanA = String(rawA || "").trim();
  const cleanB = String(rawB || "").trim();
  if (!cleanB) return null;

  const varA = selectedA || (cleanA ? getChertezhnikVariants(cleanA, catalog)[0] : {
    area: "Бишкек — Точка подачи",
    address: "Подача по согласованию",
    coords: [42.8746, 74.5698],
    basePrice: 150,
  });
  const varB = selectedB || getChertezhnikVariants(cleanB, catalog)[0];

  const trafficNum = Math.max(1, parseFloat(traffic) || 1);
  const baseSum = varA.basePrice + varB.basePrice;
  const trafficMult = trafficNum <= 1 ? 1 : 1 + (trafficNum - 1) * 0.22;
  const weatherMult = WEATHER_MULTIPLIERS[weather] || 1;
  const yandexPrice = Math.round(baseSum * trafficMult * weatherMult);
  const chertezhnikPrice = Math.round(yandexPrice * 0.9);
  const economTotal = Math.round(chertezhnikPrice * 0.9 / 10) * 10;
  const savings = Math.max(0, yandexPrice - economTotal);
  const approxKm = Math.max(1, Math.round((baseSum / 35) * 10) / 10);

  const payload = {
    agent: "chertezhnik",
    client_phone: clientPhone,
    pointA: { area: varA.area, address: varA.address, coords: varA.coords },
    pointB: { area: varB.area, address: varB.address, coords: varB.coords },
    trafficIndex: trafficNum,
    weather,
    yandexPrice,
    chertezhnikPrice,
    finalPrice: economTotal,
  };

  return {
    varA,
    varB,
    trafficNum,
    weather,
    yandexPrice,
    chertezhnikPrice,
    total: economTotal,
    savings,
    km: approxKm,
    payload,
  };
}

function useChertezhnikCatalog() {
  const [catalog, setCatalog] = T.useState(DEFAULT_CHERTEZHNIK_CATALOG);

  T.useEffect(() => {
    let active = true;
    (async () => {
      try {
        const { data, error } = await supabase
          .from("chertezhnik_addresses")
          .select("*");
        if (!active || error || !Array.isArray(data) || !data.length) return;

        const grouped = new Map();
        for (const row of data) {
          const rawKey = row.search_key || row.key || row.street || row.address || "";
          const key = normStr(String(rawKey));
          if (!key) continue;
          const lat = Number(row.lat ?? row.latitude ?? 42.8746);
          const lng = Number(row.lng ?? row.longitude ?? 74.5698);
          const variant = {
            area: row.area || row.district || "Бишкек / Чуйская обл.",
            address: row.address || row.full_address || String(rawKey),
            coords: [lat, lng],
            basePrice: Number(row.base_price ?? row.basePrice ?? 250),
          };
          if (!grouped.has(key)) grouped.set(key, { keys: [key], variants: [] });
          grouped.get(key).variants.push(variant);
        }
        if (grouped.size > 0) {
          setCatalog(Array.from(grouped.values()));
        }
      } catch {}
    })();
    return () => { active = false; };
  }, []);

  return catalog;
}

const digits = (v) => String(v || "").replace(/\D/g, "");
function normalizePhone(v) {
  if (!v) return "";
  if (v.startsWith("+996")) return "+996" + digits(v.slice(4)).slice(0, 9);
  let d = digits(v);
  if (!d) return "";
  if (d.startsWith("996")) d = d.slice(3);
  else if (d.startsWith("0")) d = d.slice(1);
  return "+996" + d.slice(0, 9);
}

const cleanPriceForInput = (str) => {
  if (!str) return "";
  if (str === "Договорная" || str === "Не указана") return "";
  const m = String(str).match(/[\d.,]+/);
  return m ? m[0] : "";
};

function formatPrice(ad) {
  if (ad.negotiable) return "Договорная";
  if (!ad.price || !String(ad.price).trim()) return "Цена не указана";
  if (isNaN(String(ad.price).replace(",", ".").trim())) return ad.price;
  const num = Number(String(ad.price).replace(",", "."));
  const cur = CURRENCIES.find((c) => c.id === ad.currency);
  const symbol = cur ? cur.symbol : "сом";
  return (Number.isFinite(num) ? num.toLocaleString("ru-RU") : ad.price) + " " + symbol;
}
const formatDate = (iso) => new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
const formatTime = (iso) => new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

/* ============================ AUTH HOOK ============================ */
function useAuth() {
  const [user, setUser] = T.useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && isValidPhone(parsed.phone)) return parsed;
      return null;
    } catch { return null; }
  });

  const register = (data) => {
    const payload = {
      phone: normalizePhone(data.phone),
      name: (data.name || "").trim() || normalizePhone(data.phone),
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch {}
    setUser(payload);

    supabase.from("orders").insert([{
      client_phone: payload.phone,
      service_id: "registration",
      hunter: "CLIENT",
      status: "REGISTERED",
      address: payload.name,
    }]).then(({ error }) => {
      if (error) console.error("Ошибка сохранения клиента:", error.message);
    });
  };

  const logout = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setUser(null);
  };

  return { user, register, logout };
}

/* ============================ CHERTEZHNIK ============================ */
function ChertezhnikScreen({ notify, user }) {
  const catalog = useChertezhnikCatalog();
  const [pointA, setPointA] = T.useState("");
  const [pointB, setPointB] = T.useState("");
  const [selectedA, setSelectedA] = T.useState(null);
  const [selectedB, setSelectedB] = T.useState(null);
  const [traffic, setTraffic] = T.useState("1.0");
  const [weather, setWeather] = T.useState("clear");
  const [calcResult, setCalcResult] = T.useState(null);
  const [logStatus, setLogStatus] = T.useState({ type: "", text: "" });
  const [saving, setSaving] = T.useState(false);

  const variantsA = getChertezhnikVariants(pointA, catalog);
  const variantsB = getChertezhnikVariants(pointB, catalog);

  const calculateAndLog = async () => {
    const rawA = pointA.trim();
    const rawB = pointB.trim();
    if (!rawA || !rawB) {
      notify("Укажите Точку А и Точку Б");
      return;
    }

    const res = calcChertezhnikRoute({
      rawA,
      rawB,
      selectedA,
      selectedB,
      catalog,
      traffic,
      weather,
      clientPhone: normalizePhone(user.phone),
    });
    if (!res) return;

    setCalcResult(res);
    setSaving(true);
    setLogStatus({ type: "warn", text: "Supabase: запись лога в chertezhnik_logs…" });

    try {
      const { error } = await supabase.from("chertezhnik_logs").insert([{
        agent: res.payload.agent,
        point_a_area: res.payload.pointA.area,
        point_a_address: res.payload.pointA.address,
        point_a_coords: res.payload.pointA.coords,
        point_b_area: res.payload.pointB.area,
        point_b_address: res.payload.pointB.address,
        point_b_coords: res.payload.pointB.coords,
        traffic_index: res.payload.trafficIndex,
        weather: res.payload.weather,
        yandex_price: res.payload.yandexPrice,
        discount_percent: 10,
        final_price: res.payload.finalPrice,
        raw_payload: res.payload,
      }]);

      if (error) {
        setLogStatus({ type: "warn", text: `Supabase: ошибка записи (${error.message})` });
      } else {
        setLogStatus({ type: "ok", text: "Supabase: лог сохранён в chertezhnik_logs" });
        notify("Расчёт сохранён в chertezhnik_logs");
      }
    } catch (err) {
      setLogStatus({ type: "warn", text: `Supabase: нет связи (${err?.message || "ошибка сети"})` });
    } finally {
      setSaving(false);
    }
  };

  return p("div", {
    className: "flex flex-1 flex-col pb-2",
    children: [
      p("section", {
        className: "rounded-[16px] bg-[var(--surface)] p-4",
        children: [
          a("h1", { className: "text-[22px] font-extrabold leading-tight", children: "«Чертёжник» — геокодинг и расчёт" }),
          a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: "Бишкек и Чуйская область · −10% от Яндекса · лог в Supabase" }),

          p("div", {
            className: "mt-4",
            children: [
              a("label", { htmlFor: "chPointA", className: "text-[12px] text-[var(--muted)]", children: "
