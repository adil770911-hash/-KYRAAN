const digits = (v) => String(v || "").replace(/\D/g, "");

function normalizePhone(v) {
  if (!v) return "";
  if (v.startsWith("+996")) return "+996" + digits(v.slice(4)).slice(0, 9);
  let d = digits(v);
  if (!d) return "";
  if (d.startsWith("996")) d = d.slice(3);
  else if (d.startsWith("0")) d = d.slice(1);
  return "+996" + d.slice(0, 9);
}
const isValidPhone = (v) => /^\+996\d{9}$/.test(v);

function copyText(text, notify) {

  ta.style.position = "fixed";
  ta.style.opacity = "0";

/* ============================ ХРАНИЛИЩЕ ============================ */
function useStored(key, fallback) {
  const [value, setValue] = T.useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw !== null) return JSON.parse(raw);
    } catch {}
    return typeof fallback === "function" ? fallback() : fallback;
  });

  T.useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }, [key, value]);

  return [value, setValue];
}

/* ============================ ФОРМАТ ============================ */
function formatPrice(ad) {
  if (ad.negotiable) return "Договорная";
  if (!ad.price || !String(ad.price).trim()) return "Цена не указана";
  const num = Number(String(ad.price).replace(",", "."));
  const cur = CURRENCIES.find((c) => c.id === ad.currency);
  const symbol = cur ? cur.symbol : "сом";
  return (Number.isFinite(num) ? num.toLocaleString("ru-RU") : ad.price) + " " + symbol;
}
const formatDate = (iso) =>
  new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
const formatTime = (iso) =>
  new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });

    setOpenId(service.id);
    setForm({ service, sub });
    setPhone("+996");

    setPointB("");
    setError("");

  const closeForm = () => {
    setForm(null);
    setError("");

  const cancelRequest = () => {
    if (!request) return;
    const id = request.serviceId;
    setRequest(null);
    setOpenId(id);
    setScrollTo(id);
    notify("Заявка отменена");

  const submit = () => {
    if (!form) return;
    if (!isValidPhone(phone)) {

    setRequest({

  T.useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 15000);
    return () => clearInterval(id);
  }, []);

  const active = T.useMemo(
    () => trips.filter((t) => t.route === route && new Date(t.departure).getTime() - now > 60000),

    const acc = { "osh-bishkek": 0, "bishkek-almaty": 0 };

const WORKER_FILTERS = [
  { id: "all", label: "Все" },
  { id: "Грузчик", label: "Грузчики" },
  { id: "Разнорабочий", label: "Разнорабочие" },
  { id: "Другое", label: "Другое" },
];

function WorkersScreen({ notify }) {
  const [workers] = T.useState(() => seedWorkers());
  const [filter, setFilter] = T.useState("all");
  const [open, setOpen] = T.useState(false);
  const [form, setForm] = T.useState({ name: "", phone: "+996", skill: "", skillOther: "", city: "" });
  const [pending, setPending] = T.useState([]);
  const [errors, setErrors] = T.useState({});

  const skill = form.skill === "Другое" ? form.skillOther.trim() : form.skill.trim();

  const submit = () => {
    const err = {};
    if (!form.name.trim()) err.name = "Укажите имя";
    if (!isValidPhone(form.phone)) err.phone = "Введите корректный номер +996";
    if (!skill) err.skill = "Выберите навык";
    setErrors(err);
    if (Object.keys(err).length) return;

    const item = {
      id: "worker-" + Date.now(),
      name: form.name.trim(),
      phone: normalizePhone(form.phone),
      skill,
      kind: form.skill,
      city: form.city.trim(),
      status: "На модерации",
    };
    setPending((prev) => [item, ...prev]);
    setForm({ name: "", phone: "+996", skill: "", skillOther: "", city: "" });
    setOpen(false);
    notify("Объявление отправлено на модерацию");
  };

  const visible = workers.filter((w) => filter === "all" || (w.kind || w.skill) === filter);

  return p("div", {
    className: "flex flex-1 flex-col pb-2",
    children: [
      p("section", {
        className: "rounded-[16px] bg-[var(--surface)] p-4",
        children: [
          a("div", {
            className: "flex items-start justify-between gap-3",
            children: [
              a("div", {
                children: [
                  a("h1", { className: "text-[24px] font-extrabold leading-tight", children: "Разнорабочие" }),
                  a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: "Самостоятельная подача объявления · бесплатно" }),
                  a("p", { className: "mt-1 text-[12px] text-[var(--muted)]", children: "Публикация после проверки модератором" }),
                ],
              }),
              a("span", {
                className: "shrink-0 rounded-full bg-[var(--green-soft)] px-3 py-1.5 text-[12px] font-bold text-[var(--green)]",
                children: "Бесплатно",
              }),
            ],
          }),
          a("button", {
            type: "button",
            onClick: () => setOpen((v) => !v),
            "aria-expanded": open,
            className: "mt-3 flex w-full items-center justify-center rounded-[12px] bg-[var(--gold)] py-3.5 text-[14px] font-bold text-black",
            children: open ? "Свернуть" : "+ Подать объявление бесплатно",
          }),
        ],
      }),

      open &&
        p("section", {
          className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4",
          children: [
            a("h2", { className: "text-[19px] font-extrabold", children: "Новое объявление" }),
            a("p", {
              className: "mt-1 text-[12px] text-[var(--muted)]",
              children: "Заполните данные. Объявление появится публично только после одобрения модератором.",
            }),
            ...[
              ["Имя", "name", "Ваше имя"],
              ["Телефон", "phone", PHONE_PLACEHOLDER],
              ["Город", "city", "Бишкек"],
            ].map(([label, key, placeholder]) =>
              p("div", {
                className: "mt-3",
                children: [
                  a("label", { className: "text-[12px] text-[var(--muted)]", children: label + (key === "city" ? "" : " *") }),
                  a("input", {
                    type: key === "phone" ? "tel" : "text",
                    inputMode: key === "phone" ? "tel" : undefined,
                    maxLength: key === "phone" ? 20 : 50,
                    value: form[key],
                    onChange: (e) =>
                      setForm((prev) => ({
                        ...prev,
                        [key]: key === "phone" ? normalizePhone(e.target.value) : e.target.value,
                      })),
                    placeholder,
                    className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none",
                  }),
                  errors[key] && a("p", { className: "mt-1 text-[12px] text-[var(--red)]", children: errors[key] }),
                ],
              })
            ),
            a("div", {
              className: "mt-3",
              children: [
                a("span", { className: "text-[12px] text-[var(--muted)]", children: "Навык *" }),
                a("div", {
                  className: "mt-2 flex flex-wrap gap-2",
                  children: ["Грузчик", "Разнорабочий", "Другое"].map((k) =>
                    a("button", {
                      type: "button",
                      onClick: () => setForm((prev) => ({ ...prev, skill: k })),
                      "aria-pressed": form.skill === k,
                      className: `rounded-full px-4 py-2.5 text-[13px] font-semibold ${
                        form.skill === k ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)] text-[var(--muted)]"
                      }`,
                      children: k,
                    }, k)
                  ),
                }),
                form.skill === "Другое" &&
                  a("input", {
                    maxLength: 40,
                    value: form.skillOther,
                    onChange: (e) => setForm((prev) => ({ ...prev, skillOther: e.target.value })),
                    placeholder: "Укажите навык",
                    className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none",
                  }),
                errors.skill && a("p", { className: "mt-1 text-[12px] text-[var(--red)]", children: errors.skill }),
              ],
            }),
            a("button", {
              type: "button",
              onClick: submit,
              className: "mt-4 w-full rounded-[12px] bg-[var(--gold)] py-3.5 text-[14px] font-bold text-black",

            }),
            a("button", {
              type: "button",
              onClick: () => setOpen(false),
              className: "mt-2 w-full py-2 text-[13px] text-[var(--muted)]",
              children: "Отмена",
            }),
          ],
        }),

      pending.length > 0 &&
        p("section", {
          className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4",
          children: [
            a("h2", { className: "text-[15px] font-bold", children: "Ваши объявления · ожидают проверки" }),
            ...pending.map((w) =>
              a("div", {
                className: "mt-2 rounded-[12px] bg-[var(--surface-2)] p-3",
                children: [
                  a("p", { className: "text-[14px] font-bold", children: w.name + " • " + w.skill }),
                  a("p", { className: "mt-1 text-[12px] text-[var(--gold)]", children: "На модерации — публично пока не показывается" }),
                ],
              }, w.id)
            ),
          ],
        }),

      p("div", {
        className: "no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-1",
        role: "group",
        "aria-label": "Фильтр по навыку",
        children: WORKER_FILTERS.map((k) =>
          a("button", {
            type: "button",
            onClick: () => setFilter(k.id),
            "aria-pressed": filter === k.id,
            className: `shrink-0 rounded-full px-4 py-2.5 text-[13px] font-semibold ${
              filter === k.id ? "bg-[var(--gold)] text-black" : "bg-[var(--surface)] text-[var(--muted)]"
            }`,
            children: k.label,
          }, k.id)
        ),
      }),

      visible.length === 0
        ? a("section", {
            className: "mt-3 rounded-[16px] bg-[var(--surface)] p-6 text-center",
            children: a("p", { className: "text-[13px] text-[var(--muted)]", children: "Пока нет опубликованных объявлений." }),
          })
        : p("div", {

const EMPTY_AD = {
  category: "", title: "", description: "", price: "",
  currency: "som", negotiable: false, city: "", phone: "",
};

function MarketForm({ initial, onCancel, onSave, notify }) {
  const [showForm, setShowForm] = T.useState(false);
  const [v, setV] = T.useState(() => ({
    category: initial?.category || "",
    title: initial?.title || "",
    description: initial?.description || "",
    price: initial?.price || "",
    currency: initial?.currency || "som",
    negotiable: initial?.negotiable || false,
    city: initial?.city || "",
    phone: initial?.phone || "",
  }));
  const [errors, setErrors] = T.useState({});
  const [draft, setDraft] = T.useState("");

  const len = v.description.trim().length;
  const phoneOk = isValidPhone(v.phone);
  const set = (key, val) => setV((prev) => ({ ...prev, [key]: val }));

  const categoryShort = v.category ? categoryById(v.category).short : "Не выбрана";
  const priceLabel = v.negotiable
    ? "Договорная"
    : v.price
      ? `${v.price} ${CURRENCIES.find((c) => c.id === v.currency)?.label || "сом"}`
      : "Не указана";

  const validate = () => {
    const e = {};
    if (!v.category) e.category = "Выберите категорию";
    if (!v.title.trim()) e.title = "Добавьте заголовок";
    if (len < 50) e.description = "Нужно ещё " + Math.max(0, 50 - len) + " симв.";
    if (!v.city.trim()) e.city = "Укажите город";
    if (!phoneOk) e.phone = "Телефон — обязательно +996 и 9 цифр";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const buildDraft = () => {
    if (!validate()) return;
    setDraft(`Здравствуйте! Хочу подать объявление в KYRAAN Маркет.

Категория: ${categoryShort}
Заголовок: ${v.title.trim()}
Описание: ${v.description.trim()}
Цена: ${priceLabel}
Город: ${v.city.trim()}
Телефон: ${normalizePhone(v.phone)}`);
    notify("Черновик собран — проверьте текст для Админа");
  };

  const save = () => {
    if (!validate()) return;
    onSave({
      id: initial?.id || "ad-" + Date.now(),
      category: v.category,
      title: v.title.trim(),
      description: v.description.trim(),
      price: v.negotiable ? "" : v.price,
      currency: v.currency,
      negotiable: v.negotiable,
      city: v.city.trim(),
      phone: normalizePhone(v.phone),
      whatsapp: normalizePhone(v.phone),
      status: "На модерации",
      createdAt: initial?.createdAt || new Date().toISOString(),
      isOwn: true,
    });
  };

  const reset = () => {
    setDraft("");
    setV({ ...EMPTY_AD });
    setErrors({});
    notify("Черновик очищен");
  };

    className: "flex flex-1 flex-col",
    children: [
      p("button", {
        type: "button",
        onClick: onCancel,
        className: "flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]",
        children: [a(Icon, { name: "arrowLeft", size: 17 }), " Назад"],
      }),
      a("h1", { className: "mt-4 text-[24px] font-extrabold leading-tight", children: "Подача объявления — через Админа" }),
      a("p", {
        className: "mt-2 text-[14px] leading-relaxed text-[var(--muted)]",
        children: "Чтобы подать объявление, зарегистрируйтесь через Админа. Напишите в WhatsApp, Админ проверит и опубликует.",
      }),

      a("div", {
        className: "mt-4 flex flex-col gap-2",
        children: [
          { n: "1", t: "Напишите Админу в WhatsApp" },
          { n: "2", t: "Отправьте текст объявления" },
          { n: "3", t: "Админ опубликует после проверки" },
        ].map((step) =>
          p("div", {
            className: "flex items-center gap-3 rounded-[12px] bg-[var(--surface-2)] p-3",
            children: [
              a("span", {
                className: "flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[var(--gold)] text-[13px] font-black text-black",
                children: step.n,
              }),
              a("span", { className: "text-[14px] font-semibold leading-snug", children: step.t }),
            ],
          }, step.n)
        ),
      }),

      a("a", {
        href: marketAdminLink,
        target: "_blank",
        rel: "noopener noreferrer",
        className: "mt-4 flex w-full items-center justify-center gap-2 rounded-[16px] bg-[var(--green)] py-4 text-center text-[15px] font-bold text-black",
        children: [a(Icon, { name: "messageCircle", size: 18 }), " Написать Админу в WhatsApp"],
      }),

                children: [a(Icon, { name: "phone", size: 17 }), " Позвонить"],
              }),
            ],
          }),
        ],
      }),

      p("section", {
        className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4",
        children: [
          a("h2", { className: "text-[15px] font-bold", children: "Описание" }),
          a("p", { className: "mt-3 whitespace-pre-wrap text-[14px] leading-relaxed text-[var(--text)]", children: ad.description }),
        ],
      }),

      p("section", {
        className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4",
        children: [
          a("h2", { className: "text-[15px] font-bold", children: "Действия" }),
          ad.isOwn
            ? p("div", {
                className: "mt-3 flex flex-col gap-2",
                children: [
                  p("button", {
                    onClick: () => onStatus(ad.id, ad.status === "Скрыто" ? "Активно" : "Скрыто"),
                    className: "flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold",
                    children: [a(Icon, { name: ad.status === "Скрыто" ? "eye" : "eyeOff", size: 16 }), " ", ad.status === "Скрыто" ? "Показать" : "Скрыть"],
                  }),
                  p("button", {
                    onClick: () => onEdit(ad),
                    className: "flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold",
                    children: [a(Icon, { name: "pencil", size: 16 }), " Редактировать"],
                  }),
                  !confirmDelete
                    ? p("button", {
                        onClick: () => setConfirmDelete(true),
                        className: "flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold text-[var(--red)]",
                        children: [a(Icon, { name: "trash2", size: 16 }), " Удалить"],
                      })
                    : p("div", {
                        className: "rounded-[12px] bg-[var(--surface-2)] p-3",
                        children: [
                          a("p", { className: "text-[13px] font-semibold text-[var(--red)]", children: "Удалить безвозвратно?" }),
                          p("div", {
                            className: "mt-3 grid grid-cols-2 gap-2",
                            children: [
                              a("button", {
                                onClick: () => onDelete(ad.id),
                                className: "rounded-[10px] bg-[var(--red)] py-2.5 text-[13px] font-bold text-black",
                                children: "Удалить",
                              }),
                              a("button", {
                                onClick: () => setConfirmDelete(false),
                                className: "rounded-[10px] bg-[var(--surface)] py-2.5 text-[13px] font-semibold",
                                children: "Отмена",
                              }),
                            ],
                          }),
                        ],
                      }),
                ],
              })
            : p("button", {
                onClick: () => setReportOpen(true),
                className: "mt-3 flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold text-[var(--red)]",
                children: [a(Icon, { name: "shieldAlert", size: 16 }), " Пожаловаться"],
              }),
        ],
      }),

      reportOpen &&
        p("section", {
          className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4",
          children: [
            a("h3", { className: "text-[15px] font-bold", children: "Пожаловаться" }),
            reported
              ? a("p", { className: "mt-2 text-[13px] text-[var(--green)]", children: "Жалоба отправлена. Спасибо!" })
              : p("div", {
                  className: "mt-3 flex flex-col gap-2",
                  children: [
                    REASONS.map((r) =>
                      a("button", {
                        onClick: () => setReason(r),
                        "aria-pressed": reason === r,
                        className: `rounded-[12px] p-3 text-left text-[13px] font-semibold ${
                          reason === r ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)]"
                        }`,
                        children: r,
                      }, r)
                    ),
                    a("button", {
                      disabled: !reason,
                      onClick: () => {
                        setReported(true);
                        setTimeout(() => setReportOpen(false), 1000);
                        notify("Жалоба отправлена");
                      },
                      className: "mt-3 w-full rounded-[12px] bg-[var(--gold)] py-3 text-[14px] font-bold text-black disabled:opacity-40",
                      children: "Отправить",
                    }),
                  ],
                }),
            a("button", {
              onClick: () => setReportOpen(false),
              className: "mt-2 w-full py-2 text-[13px] text-[var(--muted)]",
              children: "Закрыть",
            }),
          ],
        }),
    ],
  });
}

/* ============================ МАРКЕТ: КОРЕНЬ ============================ */
function MarketScreen({ notify }) {
  const [ads, setAds] = useStored("kyraan_ads", seedAds);
  const [view, setView] = T.useState("list");
  const [activeId, setActiveId] = T.useState(null);
  const [editing, setEditing] = T.useState(null);

  const active = ads.find((x) => x.id === activeId);

  const saveAd = (ad) => {
    setAds((prev) =>
      prev.some((x) => x.id === ad.id) ? prev.map((x) => (x.id === ad.id ? ad : x)) : [ad, ...prev]
    );
    setView("list");
    setEditing(null);
    notify(ad.status === "На модерации" ? "Объявление сохранено и отправлено на модерацию" : "Объявление сохранено");
  };

  const removeAd = (id) => {
    setAds((prev) => prev.filter((x) => x.id !== id));
    setView("list");
    notify("Объявление удалено");
  };

  const setStatus = (id, status) => {
    setAds((prev) => prev.map((x) => (x.id === id ? { ...x, status } : x)));
    notify("Статус обновлён: " + status);
  };

  if (view === "form") {
    return a(MarketForm, {
      initial: editing,
      onCancel: () => { setView("list"); setEditing(null); },
      onSave: saveAd,
      notify,
    });
  }

  if (view === "details" && active) {
    return a(MarketDetails, {
      ad: active,
      onBack: () => setView("list"),
      onEdit: (ad) => { setEditing(ad); setView("form"); },
      onDelete: removeAd,
      onStatus: setStatus,
      notify,
    });
  }

  return a(MarketList, {
    ads,
    onOpen: (ad) => { setActiveId(ad.id); setView("details"); },
    onAdd: () => { setEditing(null); setView("form"); },
  });
}

/* ============================ ПРИЛОЖЕНИЕ ============================ */
function App() {
  const [tab, setTab] = T.useState("home");
  const [toast, setToast] = T.useState("");

  const notify = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 4000);
  };

  const labels = { home: "Главная · Радар", taxi: "Такси", workers: "Рабочие", market: "Маркет" };

  return a("div", {
    className: "min-h-[100dvh] bg-[var(--bg)] text-[var(--text)]",
    style: { paddingTop: "var(--safe-area-inset-top)", boxSizing: "border-box" },
    children: p("div", {
      className: "mx-auto flex min-h-[calc(100dvh-var(--safe-area-inset-top))] w-full max-w-[560px] flex-col px-4 pb-2",
      children: [
        a(Header, { label: labels[tab], onBell: () => notify("Уведомления появятся позже") }),
        a(Toast, { text: toast, onClose: () => setToast("") }),

        a("main", {
          className: "flex min-w-0 flex-1 flex-col",
          children: [
            a("div", {
              role: "tabpanel",
              "aria-label": "Главная",
              className: tab === "home" ? "flex flex-1 flex-col" : "hidden",
              children: a(HomeScreen, { notify }),
            }),
            a("div", {
              role: "tabpanel",
              "aria-label": "Такси",
              className: tab === "taxi" ? "flex flex-1 flex-col" : "hidden",
              children: a(TaxiScreen, { notify }),
            }),
            a("div", {
              role: "tabpanel",
              "aria-label": "Рабочие",
              className: tab === "workers" ? "flex flex-1 flex-col" : "hidden",
              children: a(WorkersScreen, { notify }),
            }),
            a("div", {
              role: "tabpanel",
              "aria-label": "Маркет",
              className: tab === "market" ? "flex flex-1 flex-col" : "hidden",
              children: a(MarketScreen, { notify }),
            }),
          ],
        }),

        a(BottomNav, { tab, setTab }),
      ],
    }),
  });
}

createRoot(document.getElementById("root")).render(a(React.StrictMode, { children: a(App, {}) }));
</script>
