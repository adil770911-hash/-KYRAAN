    if (!btn || !btn.textContent.includes('Подтвердить и найти')) return;

    setTimeout(async () => {
      try {
        const phoneInput = document.querySelector('input[inputmode="numeric"]');
        const phone = phoneInput ? phoneInput.value : '';
        const titleEl = document.querySelector('.text-\\[18px\\].font-extrabold');
        let serviceText = titleEl ? titleEl.textContent.replace('Ищем: ', '').trim() : 'Неизвестно';
        const isSpec = ['Эвакуатор', 'Манипулятор', 'Грузоперевозки'].some(s => serviceText.includes(s));
        const hunter = isSpec ? 'HUNTER_01' : 'HUNTER_02';

        const { error } = await supabase.from('orders').insert([{ 
          client_phone: '+996' + phone, 
          service_id: 'custom_order',
          hunter: hunter,
          address: 'Уточнить у клиента'
        }]);

        if (error) {
          console.error('Ошибка Supabase:', error);
          alert('Ошибка базы: ' + error.message);
        } else {
          console.log('✅ Заказ успешно создан в Supabase!');
        }
      } catch (err) { console.error(err); }
    }, 100);
  });
