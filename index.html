<style>
*{box-sizing:border-box}html,body{margin:0;background:#0A0A0A;color:#F5F3EF;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}input,textarea{font:inherit;color:#fff}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{display:flex;gap:12px;align-items:center}.logo-b{width:40px;height:40px;background:#E8B84B;color:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.logo-t{font-weight:900;font-size:18px;line-height:1}.logo-s{font-size:11px;letter-spacing:.18em;color:#9B9B9B;text-transform:uppercase;margin-top:4px}

.card{background:#1E1E1E;border-radius:16px;padding:16px;margin-top:12px}.card2{background:#2A2A2A;border-radius:12px;padding:14px;margin-top:10px}
h1{font-size:24px;margin:4px 0}.muted{color:#9B9B9B;font-size:13px;line-height:1.4}.small{font-size:12px;color:#9B9B9B}
input,textarea{width:100%;background:#2A2A2A;border:0;border-radius:12px;padding:14px;margin-top:8px;outline:none}
input:focus,textarea:focus{outline:2px solid rgba(232,184,75,.6)}
.btn{width:100%;background:#E8B84B;color:#000;border-radius:12px;padding:15px;font-weight:800;font-size:15px;margin-top:12px}.btn:disabled{opacity:.4}
.btn-ghost{width:100%;background:#2A2A2A;color:#9B9B9B;border-radius:12px;padding:12px;font-weight:600;margin-top:8px}
.btn-green{width:100%;background:#2BD46B;color:#000;border-radius:12px;padding:13px;font-weight:800;margin-top:10px}
.btn-red{width:100%;background:transparent;border:2px solid #FF6B6B;color:#FF6B6B;border-radius:12px;padding:12px;font-weight:800;margin-top:10px}
.row{display:flex;gap:10px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.svc{display:flex;gap:12px;align-items:center;width:100%;text-align:left}.svc-ic{width:48px;height:48px;min-width:48px;background:#2A2A2A;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:22px}
.sub{width:100%;background:#2A2A2A;border-radius:12px;padding:13px;text-align:left;font-weight:600;margin-top:8px;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0A0A0A;padding:8px 12px 12px}.nav-in{max-width:560px;margin:0 auto;background:#1E1E1E;border-radius:16px;padding:8px;display:flex}
.nav button{flex:1;padding:8px 2px;font-size:11px;font-weight:700;color:#9B9B9B;border-radius:12px}.nav button.on{background:#2A2A2A;color:#fff}
.toast{background:#1E1E1E;border-radius:16px;padding:14px;margin:12px 0;font-size:13px;display:flex;gap:8px}
.radar{background:radial-gradient(circle at 50% 18%,rgba(43,212,107,.22),rgba(2,18,10,.98) 58%),#02100a;border:2px solid rgba(43,212,107,.72);border-radius:24px;padding:28px;text-align:center;margin-top:14px}
.circle{width:200px;height:200px;border-radius:999px;border:2px solid #2bd46b;margin:0 auto;position:relative;background:radial-gradient(circle,rgba(43,212,107,.18),rgba(0,28,14,.95) 62%,#010805);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(43,212,107,.88),rgba(43,212,107,.28) 58deg,transparent 78deg);animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.6);opacity:.5}}
.dot{width:16px;height:16px;background:#59ff9b;border-radius:999px;position:relative;z-index:2;animation:pulse 1.8s infinite}
.badge{display:inline-block;background:#15281D;color:#2BD46B;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800}
.badge-warn{background:#2A2415;color:#E8B84B}
.price{color:#E8B84B;font-weight:900;font-size:22px}
.hidden{display:none!important}
label{font-size:12px;color:#9B9B9B;display:block;margin-top:12px}
.err{color:#FF6B6B;font-size:13px;margin-top:8px;line-height:1.4}

.netbar.show{display:block}

<body>
<div class="netbar" id="netbar">⚠️ НЕТ ИНТЕРНЕТА — заявки сохраняются в телефоне и уйдут сами</div>
<div class="wrap">
<header>
  <div class="logo"><div class="logo-b">K</div><div><div class="logo-t">KYRAAN</div><div class="logo-s" id="tabLabel">Главная</div></div></div>

<script>
var SUPA_URL='https://eevkhnenjrskpupvtkgi.supabase.co';
var SUPA_KEY='sb_publishable_6tNocMb7Mv9HqcjVaKxDDQ_PfK1DkXe';
var KEY='kyraan_user_v1', QKEY='kyraan_queue_v1';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function digits(v){return String(v||'').replace(/\D/g,'');}
function normPhone(v){if(!v)return'';if(v.indexOf('+996')===0)return '+996'+digits(v.slice(4)).slice(0,9);var d=digits(v);if(!d)return'';if(d.indexOf('996')===0)d=d.slice(3);else if(d[0]==='0')d=d.slice(1);return '+996'+d.slice(0,9);}
function validPhone(v){return /^\+996\d{9}$/.test(v);}
function getUser(){try{var r=localStorage.getItem(KEY);if(!r)return null;var p=JSON.parse(r);return validPhone(p.phone)?p:null;}catch(e){return null;}}
function toast(m){document.getElementById('toast').innerHTML='<div class="toast">✅ '+esc(m)+'</div>';setTimeout(function(){document.getElementById('toast').innerHTML='';},5000);}
function logout(){localStorage.removeItem(KEY);render();}
function getQueue(){try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return [];}}
function setQueue(q){localStorage.setItem(QKEY,JSON.stringify(q));}
function updateNetBar(){var bar=document.getElementById('netbar');var q=getQueue();if(!navigator.onLine||q.length>0){bar.classList.add('show');bar.textContent=q.length?('⏳ В очереди: '+q.length+' заявок — уйдут сами, как появится интернет'):'⚠️ НЕТ ИНТЕРНЕТА — заявки сохраняются в телефоне и уйдут сами';}else{bar.classList.remove('show');}}
window.addEventListener('online',function(){updateNetBar();flushQueue();});
window.addEventListener('offline',updateNetBar);
// --- Supabase с таймаутом 8 сек ---
function supa(path,method,body){
  var ctrl=new AbortController(); var timer=setTimeout(function(){ctrl.abort();},8000);
  return fetch(SUPA_URL+'/rest/v1/'+path,{method:method||'GET',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:body?JSON.stringify(body):undefined,signal:ctrl.signal}).then(function(r){clearTimeout(timer);return r.json().then(function(j){if(!r.ok)throw new Error('Supabase '+r.status+': '+((j&&j.message)||JSON.stringify(j).slice(0,120)));return j;});}).catch(function(e){clearTimeout(timer);if(e.name==='AbortError')throw new Error('Таймаут 8 сек — медленный интернет');throw new Error(e.message||'Failed to fetch');});
}
// --- ОФФЛАЙН-ОЧЕРЕДЬ: главное исправление Failed to fetch ---
function sendOrderSmart(payload, onOk, onQueued){
  return supa('orders','POST',[payload]).then(function(j){if(onOk)onOk(j);return j;}).catch(function(e){
    // Любая ошибка сети -> сохраняем в очередь, НЕ теряем заявку
    var q=getQueue(); q.push({payload:payload,created_at:new Date().toISOString(),error:e.message}); setQueue(q); updateNetBar();
    if(onQueued)onQueued(e); else toast('Нет интернета — заявка сохранена, уйдёт сама');
    return null;
  });
}
function flushQueue(){
  var q=getQueue(); if(!q.length)return; if(!navigator.onLine)return;
  var item=q[0];
  supa('orders','POST',[item.payload]).then(function(){q.shift();setQueue(q);updateNetBar();toast('Очередь: заявка отправлена ✅');if(q.length)flushQueue();else render();}).catch(function(){updateNetBar();});
}
setInterval(flushQueue,15000);
setInterval(updateNetBar,5000);

var SERVICES={evacuator:'Эвакуатор',manipulator:'Манипулятор',cargo:'Грузоперевозки',plumber:'Сантехник',electrician:'Электрик',cleaning:'Клининг',welder:'Сварщик',fridge:'Ремонт холодильника',washer:'Ремонт стиральной',tv:'Телемастер',hour:'Мастер на час'};
var SUBS={evacuator:['Sprinter','Sprinter+прицеп','Atego','Atego+прицеп'],manipulator:['3т','5т','8т','10т'],cargo:['Porter','Sprinter 1-скат','1-скатная будка','1-скатный бортовой','Sprinter 2-скат','2-скатная будка','2-скатный бортовой','Гигант бортовой','Гигант будка']};
var TARIFFS={econom:{label:'Эконом',emoji:'🚕',base:60,perKm:15,min:120,color:'#2BD46B'},comfort:{label:'Комфорт',emoji:'🚙',base:80,perKm:22,min:180,color:'#E8B84B'},universal:{label:'Универсал',emoji:'🚐',base:70,perKm:20,min:160,color:'#4A9EFF'},minivan:{label:'Минивэн',emoji:'🚌',base:90,perKm:25,min:200,color:'#A78BFA'}};
var CATS=[{id:'intl',label:'Международная'},{id:'domestic',label:'Внутренняя'},{id:'agro',label:'Агропродукция'},{id:'buy',label:'Куплю'},{id:'sell',label:'Продам'}];
var tab='home', openSvc=null, formSvc=null, formSub='', pointA='', pointB='', taxiA=null, taxiB=null, taxiTariff='econom', taxiRoute=null, activeTaxi=null, workers=[], marketAds=[], marketFilter='all', marketView='list', marketActive=null, myOrders=[], radarOrder=null;
function go(t){tab=t;document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);});document.getElementById('tabLabel').textContent={home:'Главная',taxi:'Такси',workers:'Рабочие',market:'Маркет',orders:'Мои заказы'}[t]||'Главная';render();}
function render(){
  updateNetBar();
  var u=getUser(); var app=document.getElementById('app');
  document.getElementById('phonePill').textContent=u?(u.phone+' · Выйти'):'Войти';
  if(!u){app.innerHTML='<div style="text-align:center;margin-top:28px"><div class="logo-b" style="width:64px;height:64px;font-size:26px;margin:0 auto">K</div><h1 style="font-size:26px;margin-top:18px">Добро пожаловать</h1><p class="muted">Зарегистрируйтесь по номеру телефона</p></div><div class="card"><label>Телефон * · +996</label><input id="regPhone" value="+996" inputmode="tel" placeholder="+996 704 644 876"><div class="small" style="margin-top:6px">+996 и 9 цифр</div><label>Ваше имя (по желанию)</label><input id="regName" placeholder="Например, Азамат"><div id="regErr" class="err"></div><button class="btn" onclick="doReg()">Зарегистрироваться</button><p class="small" style="text-align:center;margin-top:10px">Регистрируясь, вы соглашаетесь с условиями KYRAAN</p></div>';return;}
  if(tab==='home')renderHome(u,app);
  else if(tab==='taxi')renderTaxi(u,app);
  else if(tab==='workers')renderWorkers(u,app);
  else if(tab==='market')renderMarket(u,app);
  else if(tab==='orders')renderOrders(u,app);
}
function doReg(){
  var ph=normPhone(document.getElementById('regPhone').value);
  if(!validPhone(ph)){document.getElementById('regErr').textContent='Введите +996 и 9 цифр';return;}
  var name=(document.getElementById('regName').value||'').trim()||ph;
  localStorage.setItem(KEY,JSON.stringify({phone:ph,name:name}));
  sendOrderSmart({client_phone:ph,service_id:'registration',hunter:'CLIENT',status:'REGISTERED',address:name},null,null);
  toast('Добро пожаловать!');render();
}
function renderHome(u,app){
  var q=getQueue();
  var queueBanner=q.length?'<div class="card" style="border:1px solid #E8B84B"><b>⏳ В очереди: '+q.length+' заявок</b><div class="muted">Нет интернета — уйдут сами. Не удаляйте приложение.</div><button class="btn-ghost" onclick="flushQueue()">🔄 Попробовать отправить сейчас</button></div>':'';
  if(radarOrder){
    app.innerHTML=queueBanner+'<div class="card"><div class="flex-between"><div><span class="badge">🔍 Поиск исполнителя</span><div style="font-weight:800;margin-top:6px">'+esc(radarOrder.title)+'</div></div><button class="pill" onclick="cancelRadar()">Отменить</button></div></div><div class="radar"><div class="circle"><div class="sweep"></div><div class="dot"></div></div><p style="color:#8affbc;font-weight:900;letter-spacing:.18em;font-size:12px;margin-top:18px">РАДАР АКТИВЕН</p><h2 style="color:#5dff9b;font-size:27px;margin:10px 0">Заявка отправлена</h2><div style="background:rgba(1,18,9,.72);border:1px solid rgba(43,212,107,.35);border-radius:16px;padding:18px;text-align:left"><div style="font-weight:900;font-size:18px">'+esc(radarOrder.title)+'</div><div style="color:#b8ffcf;font-weight:700;margin-top:8px">Телефон: '+esc(u.phone)+'</div>'+(radarOrder.a?'<div style="margin-top:8px">Откуда: '+esc(radarOrder.a)+'</div>':'')+(radarOrder.b?'<div>Куда: '+esc(radarOrder.b)+'</div>':'')+'</div><p style="color:#b8ffcf;font-weight:600">Исполнитель перезвонит.</p><button class="btn" style="background:transparent;border:2px solid #2bd46b;color:#5dff9b" onclick="cancelRadar()">Отменить заявку</button></div>';return;
  }
  var h1='<h1>Что нужно?</h1><p class="muted">Зашёл, выбрал — и всё.</p>';
  var taxiBtn='<button class="taxi-hero" onclick="go(\'taxi\')"><span style="font-size:40px">🚖</span><span style="flex:1"><span style="display:block;font-weight:900;font-size:18px">Бишкек Такси</span><span style="display:block;font-size:12px;opacity:.7">Посадка + километраж</span><span style="font-size:11px;opacity:.6">Без комиссии для водителя</span></span>→</button>';
  var ordersBtn='<button class="card" style="width:100%;text-align:left" onclick="go(\'orders\')">📦 <b>Мои заказы</b><div class="muted">Нажмите, чтобы посмотреть статусы</div></button>';
  var h01='<div style="margin-top:22px" class="flex-between"><b style="font-size:12px;letter-spacing:.14em;color:#9B9B9B">HUNTER 01 · СПЕЦТЕХНИКА</b><span class="pill">3 услуги</span></div>';
  var h01list=['evacuator','manipulator','cargo'].map(function(id){var subs=SUBS[id];return '<div class="card"><button class="svc" onclick="toggleSvc(\''+id+'\')"><span class="svc-ic">🚚</span><span style="flex:1"><b>'+SERVICES[id]+'</b><div class="muted">'+subs.length+' вариантов</div></span>▼</button>'+(openSvc===id?subs.map(function(s){return '<button class="sub" onclick="openForm(\''+id+'\',\''+esc(s)+'\')">'+esc(s)+'</button>';}).join(''):'')+(formSvc===id?formHtml():'')+'</div>';}).join('');
  var h02='<div style="margin-top:22px" class="flex-between"><b style="font-size:12px;letter-spacing:.14em;color:#9B9B9B">HUNTER 02 · МАСТЕРА</b><span class="pill">8 услуг</span></div>';
  var h02list=['plumber','electrician','cleaning','welder','fridge','washer','tv','hour'].map(function(id){return '<div class="card"><button class="svc" onclick="openForm(\''+id+'\',\''+SERVICES[id]+'\')"><span class="svc-ic">🔧</span><span style="flex:1"><b>'+SERVICES[id]+'</b><div class="muted">Нажмите — зашёл, выбрал</div></span>›</button>'+(formSvc===id?formHtml():'')+'</div>';}).join('');
  app.innerHTML=queueBanner+h1+taxiBtn+ordersBtn+h01+h01list+h02+h02list;
}
function toggleSvc(id){openSvc=openSvc===id?null:id;render();}
function openForm(id,sub){formSvc=id;formSub=sub;pointA='';pointB='';render();}
function formHtml(){return '<div class="card2"><b>Оформление — '+esc(SERVICES[formSvc])+(formSub&&formSub!==SERVICES[formSvc]?' · '+esc(formSub):'')+'</b><div class="small" style="margin-top:8px">📞 '+esc(getUser().phone)+'</div><label>Точка А (по желанию)</label><input id="formA" value="'+esc(pointA)+'" placeholder="Откуда" oninput="pointA=this.value"><label>Точка Б (по желанию)</label><input id="formB" value="'+esc(pointB)+'" placeholder="Куда" oninput="pointB=this.value"><div id="formErr" class="err"></div><div id="formOk" class="ok"></div><button class="btn" onclick="submitService()">Отправить заявку</button><button class="btn-ghost" onclick="formSvc=null;render()">Отмена</button></div>';}
function submitService(){
  var u=getUser();var addr=[pointA,pointB].filter(Boolean).join(' → ')||'Уточнить у клиента';
  var payload={client_phone:u.phone,service_id:formSvc,hunter:(['plumber','electrician','cleaning','welder','fridge','washer','tv','hour'].indexOf(formSvc)>=0)?'HUNTER_02':'HUNTER_01',status:'NEW',address:addr,variant_id:formSub};
  var title=SERVICES[formSvc]+(formSub?' · '+formSub:'');
  // Сначала показываем радар сразу, не ждём сеть
  radarOrder={id:'local-'+Date.now(),title:title,a:pointA,b:pointB,queued:true}; formSvc=null; render();
  sendOrderSmart(payload,function(j){radarOrder.id=j&&j[0]&&j[0].id;radarOrder.queued=false;toast('Заявка отправлена ✅');render();},function(e){toast('Сохранено в телефоне — уйдёт при интернете ⏳');document.getElementById('debug').textContent='Диагностика: '+e.message+' | online='+navigator.onLine;});
}
function cancelRadar(){if(!radarOrder)return;if(!String(radarOrder.id).startsWith('local-')){supa('orders?id=eq.'+radarOrder.id,'PATCH',{status:'CANCELLED'}).catch(function(){});}else{var q=getQueue();q=q.filter(function(x){return x.payload.service_id!==formSvc;});setQueue(q);}radarOrder=null;toast('Заявка отменена');render();}
function renderTaxi(u,app){
  if(activeTaxi){
