function calcTaxiPrice(distanceKm, tariffId) {
  const t = TAXI_TARIFFS[tariffId] || TAXI_TARIFFS.econom;
  const raw = t.base + (Number(distanceKm) || 0) * t.perKm;
  return Math.max(t.min, Math.round(raw / 10) * 10);
}

async function calcRouteDistance(lat1, lng1, lat2, lng2) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=false`;
    const r = await fetch(url);
    const j = await r.json();
    if (j.code !== "Ok" || !j.routes?.[0]) return null;
    return {
      km: Math.round((j.routes[0].distance / 1000) * 10) / 10,
      minutes: Math.round(j.routes[0].duration / 60),
    };
  } catch { return null; }
}

async function reverseGeocode(lat, lng) {
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ru`
    );
    const j = await r.json();
    return j.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  } catch {
    return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  }
}

}

function formatPrice(ad) {
  if (ad.negotiable) return "Договорная";
  if (!ad.price || !String(ad.price).trim()) return "Цена не указана";
  if (isNaN(String(ad.price).replace(",", ".").trim())) return ad.price;
  const num = Number(String(ad.price).replace(",", "."));
  const cur = CURRENCIES.find((c) => c.id === ad.currency);
  const symbol = cur ? cur.symbol : "сом";
  return (Number.isFinite(num) ? num.toLocaleString("ru-RU") : ad.price) + " " + symbol;
}

      const parsed = JSON.parse(raw);
      if (parsed && isValidPhone(parsed.phone)) return parsed;
      return null;
    } catch { return null; }
  });

  const register = (data) => {
    const payload = {
      phone: normalizePhone(data.phone),
      name: (data.name || "").trim() || normalizePhone(data.phone),
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch {}
    setUser(payload);

    supabase.from('orders').insert([{
      client_phone: payload.phone,
      service_id: 'registration',
      hunter: 'CLIENT',
      status: 'REGISTERED',
      address: payload.name,
    }]).then(({ error }) => {
      if (error) console.error('Reg:', error.message);
    });
  };

  const logout = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setUser(null);
  };

  return { user, register, logout };
}

function MapPicker({ initial, onPick, onClose }) {
  const ref = T.useRef(null);
  T.useEffect(() => {
    const L = window.L;
    if (!L || !ref.current) return;
    const map = L.map(ref.current).setView(
      initial ? [initial.lat, initial.lng] : [42.8746, 74.5698], 13
    );
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap", maxZoom: 19,
    }).addTo(map);
    let marker = initial ? L.marker([initial.lat, initial.lng]).addTo(map) : null;
    map.on("click", (e) => {
      const { lat, lng } = e.latlng;
      if (marker) marker.setLatLng([lat, lng]);
      else marker = L.marker([lat, lng]).addTo(map);
      onPick({ lat, lng });
    });
    return () => map.remove();
  }, []);

  return p("div", { className: "map-picker-box", children: [
    p("div", { className: "flex items-center justify-between bg-[var(--surface)] p-3", children: [
      p("span", { className: "text-[14px] font-bold", children: "Тапните по карте" }),
      a("button", { onClick: onClose, className: "rounded-full bg-[var(--surface-2)] p-2", children: a(Icon, { name: "x", size: 18 }) }),
    ]}),
    a("div", { ref, style: { flex: 1 } }),
  ]});
}

function TaxiOrderScreen({ notify, user, activeOrder, setActiveOrder, onBack }) {
  const [pointA, setPointA] = T.useState(null);
  const [pointB, setPointB] = T.useState(null);
  const [tariff, setTariff] = T.useState("econom");
  const [route, setRoute] = T.useState(null);
  const [calcLoading, setCalcLoading] = T.useState(false);
  const [picker, setPicker] = T.useState(null);
  const [sending, setSending] = T.useState(false);
  const [error, setError] = T.useState("");

  T.useEffect(() => {
    if (!pointA || !pointB) { setRoute(null); return; }
    setCalcLoading(true);
    calcRouteDistance(pointA.lat, pointA.lng, pointB.lat, pointB.lng).then((r) => {
      setRoute(r); setCalcLoading(false);
    });
  }, [pointA, pointB]);

  const pickFromGPS = () => {
    if (!navigator.geolocation) { notify("Геолокация недоступна"); return; }
    notify("Получаем GPS...");
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        const addr = await reverseGeocode(latitude, longitude);
        setPointA({ lat: latitude, lng: longitude, address: addr });
      },
      () => notify("Разрешите доступ к геолокации"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const onMapPick = async (target) => async ({ lat, lng }) => {
    const addr = await reverseGeocode(lat, lng);
    if (target === "A") setPointA({ lat, lng, address: addr });
    else setPointB({ lat, lng, address: addr });
    setPicker(null);
  };

  const price = route ? calcTaxiPrice(route.km, tariff) : null;

  const submit = async () => {
    if (!pointA || !pointB) { setError("Укажите точки А и Б"); return; }
    if (!route) { setError("Маршрут ещё считается"); return; }
    setSending(true);

    const { data, error: e } = await supabase.from("orders").insert([{
      client_phone: normalizePhone(user.phone),
      service_id: "city_taxi",
      hunter: "HUNTER_01",
      status: "NEW",
      taxi_stage: "searching",
      address: joinAddress(pointA.address, pointB.address),
      pickup_lat: pointA.lat, pickup_lng: pointA.lng,
      drop_lat: pointB.lat, drop_lng: pointB.lng,
      distance_km: route.km,
      price_som: price,
      taxi_tariff: tariff,
      variant_id: TAXI_TARIFFS[tariff].label,
    }]).select().single();

    setSending(false);
    if (e) { setError("Ошибка: " + e.message); return; }
    setActiveOrder(data);
    notify("Заказ отправлен — ищем водителя");
  };

  const cancelOrder = async () => {
    if (!activeOrder) return;
    await supabase.from("orders")
      .update({ taxi_stage: "cancelled", status: "CANCELLED" })
      .eq("id", activeOrder.id);
    setActiveOrder(null);
    notify("Заказ отменён");
  };

  const newOrder = () => {
    setActiveOrder(null);
    setPointA(null); setPointB(null); setRoute(null);
  };

  /* ===== ТРЕКИНГ АКТИВНОГО ЗАКАЗА ===== */
  if (activeOrder) {
    const stage = activeOrder.taxi_stage || "searching";
    const stageIcon = { searching: "🔍", assigned: "🚕", arrived: "📍", riding: "🛣", done: "🏁", cancelled: "✖" }[stage] || "🚖";
    const { pointA: addrA, pointB: addrB } = splitAddress(activeOrder.address || "");

    return p("div", { className: "flex flex-1 flex-col pb-4", children: [
      p("button", { onClick: onBack, className: "mt-2 flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]", children: [a(Icon, { name: "arrowLeft", size: 17 }), " На главную"] }),

      p("div", { className: `mt-4 rounded-[20px] bg-[var(--surface)] p-5 text-center ring-2 ${stage === "done" ? "ring-[var(--green)]" : stage === "cancelled" ? "ring-[var(--red)]" : "ring-[var(--gold)] pulse-soft"}`, children: [
        a("div", { className: "text-[44px]", children: stageIcon }),
        a("h2", { className: "mt-2 text-[20px] font-extrabold", children: TAXI_STAGE_LABEL[stage] || "В работе" }),
        activeOrder.price_som && a("p", { className: "mt-2 text-[28px] font-black text-[var(--gold)]", children: [activeOrder.price_som, " сом"] }),
        activeOrder.distance_km && a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: [activeOrder.variant_id, " · ", activeOrder.distance_km, " км"] }),
      ]}),

      p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
        a("h3", { className: "text-[12px] font-bold uppercase tracking-wider text-[var(--muted)]", children: "Маршрут" }),
        addrA && p("p", { className: "mt-2 text-[13px] leading-relaxed" }, [
          a("span", { className: "text-[var(--muted)]", children: "Откуда: " }),
          a("b", { children: addrA }),
        ]),
        addrB && p("p", { className: "mt-1 text-[13px] leading-relaxed" }, [
          a("span", { className: "text-[var(--muted)]", children: "Куда: " }),
          a("b", { children: addrB }),
        ]),
      ]}),

      ["assigned", "arrived", "riding"].includes(stage) && activeOrder.executor_id && a(TaxiDriverCard, { executorId: activeOrder.executor_id, notify }),

      ["searching", "assigned"].includes(stage) && a("button", {
        onClick: cancelOrder,
        className: "mt-3 w-full rounded-[14px] border-2 border-[var(--red)] py-3.5 text-[14px] font-extrabold text-[var(--red)]",
        children: "Отменить заказ",
      }),

      stage === "done" && a("button", {
        onClick: newOrder,
        className: "mt-3 w-full rounded-[14px] bg-[var(--gold)] py-3.5 text-[14px] font-extrabold text-black",
        children: "Заказать ещё",
      }),

      stage === "cancelled" && a("button", {
        onClick: newOrder,
        className: "mt-3 w-full rounded-[14px] bg-[var(--surface-2)] py-3.5 text-[14px] font-extrabold",
        children: "Вернуться",
      }),
    ]});
  }

  /* ===== ФОРМА ЗАКАЗА ===== */
  return p("div", { className: "flex flex-1 flex-col pb-4", children: [
    p("button", { onClick: onBack, className: "mt-2 flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]", children: [a(Icon, { name: "arrowLeft", size: 17 }), " Назад"] }),

    a("h1", { className: "mt-4 text-[26px] font-extrabold", children: "🚖 Бишкек Такси" }),
    a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: "Посадка + километраж · без комиссии" }),

    p("section", { className: "mt-4 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("label", { className: "text-[12px] font-bold uppercase text-[var(--muted)]", children: "📍 Откуда" }),
      p("div", { className: "mt-2 flex gap-2", children: [
        a("div", { className: "flex-1 rounded-[12px] bg-[var(--surface-2)] p-3 text-[13px] leading-relaxed", children: pointA ? pointA.address : "Не выбрано" }),
        p("button", { onClick: pickFromGPS, className: "rounded-[12px] bg-[var(--gold)] px-3 text-[13px] font-bold text-black", children: "GPS" }),
        p("button", { onClick: () => setPicker("A"), className: "rounded-[12px] bg-[var(--surface-2)] px-3 text-[13px] font-bold", children: "Карта" }),
      ]}),
    ]}),

    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("label", { className: "text-[12px] font-bold uppercase text-[var(--muted)]", children: "🏁 Куда" }),
      p("div", { className: "mt-2 flex gap-2", children: [
        a("div", { className: "flex-1 rounded-[12px] bg-[var(--surface-2)] p-3 text-[13px] leading-relaxed", children: pointB ? pointB.address : "Не выбрано" }),
        p("button", { onClick: () => setPicker("B"), className: "rounded-[12px] bg-[var(--surface-2)] px-3 text-[13px] font-bold", children: "Карта" }),
      ]}),
    ]}),

    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("label", { className: "text-[12px] font-bold uppercase text-[var(--muted)]", children: "Тариф" }),
      p("div", { className: "mt-2 grid grid-cols-2 gap-2", children: Object.entries(TAXI_TARIFFS).map(([id, t]) =>
        p("button", { key: id, onClick: () => setTariff(id), "aria-pressed": tariff === id,
          className: "rounded-[12px] p-3 text-left transition",
          style: {
            background: tariff === id ? t.color + "22" : "var(--surface-2)",
            boxShadow: tariff === id ? `0 0 0 2px ${t.color}` : "none",
          },
          children: [
            a("div", { className: "text-[18px]", children: t.emoji }),
            a("div", { className: "mt-1 text-[13px] font-bold", children: t.label }),
            a("div", { className: "mt-0.5 text-[11px] text-[var(--muted)]", children: `${t.base} + ${t.perKm}/км` }),
          ]
        })
      )}),
    ]}),

    pointA && pointB && p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      calcLoading
        ? a("p", { className: "text-center text-[13px] text-[var(--muted)]", children: "Считаем маршрут..." })
        : route
          ? p("div", { className: "flex items-center justify-between", children: [
              p("div", { children: [
                a("p", { className: "text-[13px] text-[var(--muted)]", children: `${route.km} км · ~${route.minutes} мин` }),
                a("p", { className: "mt-0.5 text-[11px] text-[var(--muted)]", children: `Посадка ${TAXI_TARIFFS[tariff].base} + ${route.km} × ${TAXI_TARIFFS[tariff].perKm}` }),
              ]}),
              a("p", { className: "text-[24px] font-black text-[var(--gold)]", children: `${price} сом` }),
            ]})
          : a("p", { className: "text-center text-[13px] text-[var(--red)]", children: "Не удалось посчитать маршрут" }),
    ]}),

    error && a("p", { className: "mt-3 text-[12px] text-[var(--red)]", children: error }),

    a("button", {
      onClick: submit,
      disabled: sending || !route,
      className: "mt-4 w-full rounded-[16px] bg-[var(--gold)] py-4 text-[15px] font-extrabold text-black disabled:opacity-40",
      children: sending ? "Отправка..." : (price ? `Заказать за ${price} сом` : "Заказать"),
    }),

    picker && a(MapPicker, {
      initial: picker === "A" ? pointA : pointB,
      onPick: onMapPick(picker),
      onClose: () => setPicker(null),
    }),
  ]});
}

/* ============================ WORKERS ============================ */
function WorkersScreen({ notify, user }) {
  const [workers, setWorkers] = T.useState([]);
  const [loading, setLoading] = T.useState(true);
  const [filter, setFilter] = T.useState("all");
  const [open, setOpen] = T.useState(false);
  const [form, setForm] = T.useState({ name: user.name || "", skill: "", skillOther: "", city: "" });
  const [errors, setErrors] = T.useState({});
  const [submitting, setSubmitting] = T.useState(false);

  const skill = form.skill === "Другое" ? form.skillOther.trim() : form.skill.trim();

  const loadWorkers = async () => {
    const { data } = await supabase.from("orders")
      .select("*")
      .eq("service_id", "workers")
      .order("created_at", { ascending: false });
    if (data) {
      setWorkers(data.map(o => {
        const parts = (o.address || "").split(" | ");
        return {
          id: o.id, name: parts[0] || "Без имени", city: parts[1] || "",
          skill: o.variant_id, kind: o.variant_id, phone: o.client_phone,
        };
      }));
    }
    setLoading(false);
  };

  T.useEffect(() => { loadWorkers(); }, []);

  const submit = async () => {
    const err = {};
    if (!form.name.trim()) err.name = "Укажите имя";
    if (!skill) err.skill = "Выберите навык";
    setErrors(err);
    if (Object.keys(err).length) return;

    setSubmitting(true);
    const { error } = await supabase.from("orders").insert([{
      service_id: "workers",
      variant_id: skill,
      client_phone: normalizePhone(user.phone),
      address: `${form.name.trim()} | ${form.city.trim() || "Город не указан"}`,
      hunter: "BOARD", status: "NEW",
    }]);
    setSubmitting(false);
    if (error) { notify("Ошибка: " + error.message); return; }
    setForm({ name: user.name || "", skill: "", skillOther: "", city: "" });
    setOpen(false);
    notify("Объявление опубликовано!");
    loadWorkers();
  };

  const visible = workers.filter((w) => filter === "all" || w.kind === filter);

  return p("div", { className: "flex flex-1 flex-col pb-2", children: [
    p("section", { className: "rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("div", { className: "flex items-start justify-between gap-3", children: [
        a("div", { children: [
          a("h1", { className: "text-[24px] font-extrabold leading-tight", children: "Разнорабочие" }),
          a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: "Бесплатная доска" }),
        ] }),
        a("span", { className: "shrink-0 rounded-full bg-[var(--green-soft)] px-3 py-1.5 text-[12px] font-bold text-[var(--green)]", children: "Бесплатно" }),
      ] }),
      a("button", { type: "button", onClick: () => setOpen((v) => !v), "aria-expanded": open, className: "mt-3 flex w-full items-center justify-center rounded-[12px] bg-[var(--gold)] py-3.5 text-[14px] font-bold text-black", children: open ? "Свернуть" : "+ Подать объявление" }),
    ] }),
    open && p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("h2", { className: "text-[19px] font-extrabold", children: "Новое объявление" }),
      p("div", { className: "mt-3 flex items-center gap-2 rounded-[12px] bg-[var(--surface-2)] px-3 py-2.5", children: [
        a(Icon, { name: "phone", size: 14, className: "text-[var(--gold)]" }),
        a("span", { className: "text-[13px] font-semibold", children: user.phone }),
      ] }),
      p("div", { className: "mt-3", children: [
        a("label", { className: "text-[12px] text-[var(--muted)]", children: "Имя *" }),
        a("input", { maxLength: 50, value: form.name, onChange: (e) => setForm((prev) => ({ ...prev, name: e.target.value })), placeholder: "Ваше имя", className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
        errors.name && a("p", { className: "mt-1 text-[12px] text-[var(--red)]", children: errors.name }),
      ] }),
      p("div", { className: "mt-3", children: [
        a("label", { className: "text-[12px] text-[var(--muted)]", children: "Город" }),
        a("input", { maxLength: 50, value: form.city, onChange: (e) => setForm((prev) => ({ ...prev, city: e.target.value })), placeholder: "Бишкек", className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
      ] }),
      a("div", { className: "mt-3", children: [
        a("span", { className: "text-[12px] text-[var(--muted)]", children: "Навык *" }),
        a("div", { className: "mt-2 flex flex-wrap gap-2", children: ["Грузчик", "Разнорабочий", "Другое"].map((k) => a("button", { type: "button", onClick: () => setForm((prev) => ({ ...prev, skill: k })), "aria-pressed": form.skill === k, className: `rounded-full px-4 py-2.5 text-[13px] font-semibold ${form.skill === k ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)] text-[var(--muted)]"}`, children: k }, k)) }),
        form.skill === "Другое" && a("input", { maxLength: 40, value: form.skillOther, onChange: (e) => setForm((prev) => ({ ...prev, skillOther: e.target.value })), placeholder: "Укажите навык", className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
        errors.skill && a("p", { className: "mt-1 text-[12px] text-[var(--red)]", children: errors.skill }),
      ] }),
      a("button", { type: "button", onClick: submit, disabled: submitting, className: "mt-4 w-full rounded-[12px] bg-[var(--gold)] py-3.5 text-[14px] font-bold text-black disabled:opacity-40", children: submitting ? "Отправка..." : "Опубликовать" }),
      a("button", { type: "button", onClick: () => setOpen(false), className: "mt-2 w-full py-2 text-[13px] text-[var(--muted)]", children: "Отмена" }),
    ] }),
    p("div", { className: "no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-1", children: [{ id: "all", label: "Все" }, { id: "Грузчик", label: "Грузчики" }, { id: "Разнорабочий", label: "Разнорабочие" }, { id: "Другое", label: "Другое" }].map((k) => a("button", { type: "button", onClick: () => setFilter(k.id), "aria-pressed": filter === k.id, className: `shrink-0 rounded-full px-4 py-2.5 text-[13px] font-semibold ${filter === k.id ? "bg-[var(--gold)] text-black" : "bg-[var(--surface)] text-[var(--muted)]"}`, children: k.label }, k.id)) }),
    loading ? a("div", { className: "mt-10 flex justify-center", children: a("div", { className: "loader" }) })
      : visible.length === 0 ? a("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-6 text-center", children: a("p", { className: "text-[13px] text-[var(--muted)]", children: "Пока нет объявлений." }) })
      : p("div", { className: "mt-3 flex flex-col gap-3", children: visible.map((w) => a("article", { key: w.id, className: "rounded-[16px] bg-[var(--surface)] p-4", children: [
          a("p", { className: "text-[16px] font-bold", children: w.name + " • " + w.skill }),
          a("p", { className: "mt-1 text-[13px] text-[var(--muted)]", children: w.city || "Город не указан" }),
          a("p", { className: "mt-2 text-[13px] font-semibold", children: w.phone }),
          a("a", { href: telHref(w.phone), className: "mt-3 flex w-full items-center justify-center rounded-[12px] bg-[var(--green)] py-3 text-[14px] font-bold text-black", children: "Позвонить" }),
        ]}, w.id)) }),
  ] });
}

function MarketForm({ initial, user, onCancel, onSave, notify }) {
  const [v, setV] = T.useState({
    category: initial?.category || "", title: initial?.title || "", description: initial?.description || "",
    price: initial && !initial.negotiable ? cleanPriceForInput(initial.price) : "",
    currency: initial?.currency || "som", negotiable: initial?.negotiable || false,
    city: initial?.city || "",
  });
  const [errors, setErrors] = T.useState({});
  const [saving, setSaving] = T.useState(false);
  const len = v.description.trim().length;
  const set = (key, val) => setV((prev) => ({ ...prev, [key]: val }));

  const save = async () => {
    const e = {};
    if (!v.category) e.category = "Выберите категорию";
    if (!v.title.trim()) e.title = "Добавьте заголовок";
    if (len < 50) e.description = "Нужно ещё " + Math.max(0, 50 - len) + " симв.";
    if (!v.city.trim()) e.city = "Укажите город";
    setErrors(e);
    if (Object.keys(e).length) return;

    setSaving(true);
    const priceStr = v.negotiable ? "Договорная" : v.price ? v.price + " " + (CURRENCIES.find(c => c.id === v.currency)?.label || "сом") : "Не указана";
    const addressStr = `${v.title.trim()} | ${v.city.trim()} | ${v.description.trim()} | ${priceStr}`;
    const payload = { service_id: "market", variant_id: v.category, client_phone: normalizePhone(user.phone), address: addressStr, hunter: "BOARD", status: "NEW" };

    let error = null;
    if (initial?.id) {
      const res = await supabase.from("orders").update(payload).eq("id", initial.id);
      error = res.error;
    } else {
      const res = await supabase.from("orders").insert([payload]);
      error = res.error;
    }
    setSaving(false);
    if (error) notify("Ошибка: " + error.message);
    else onSave();
  };

  return p("div", { className: "flex flex-1 flex-col pb-4", children: [
    p("button", { type: "button", onClick: onCancel, className: "flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]", children: [a(Icon, { name: "arrowLeft", size: 17 }), " Назад"] }),
    a("h1", { className: "mt-4 text-[24px] font-extrabold leading-tight", children: initial ? "Редактирование" : "Подача объявления" }),
    p("section", { className: "mt-4 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("h2", { className: "text-[15px] font-bold", children: "Категория" }),
      a("div", { className: "mt-3 grid gap-2", children: CATEGORIES.map((c) => p("button", { key: c.id, onClick: () => set("category", c.id), className: `flex items-center gap-3 rounded-[12px] p-3 text-left ${v.category === c.id ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)]"}`, children: [
        a("span", { className: `flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${v.category === c.id ? "bg-black/15" : "bg-[var(--surface)]"}`, children: a(Icon, { name: c.icon, size: 18 }) }),
        p("span", { className: "min-w-0", children: [ a("span", { className: "block text-[14px] font-bold leading-snug", children: c.short }), a("span", { className: `block text-[12px] ${v.category === c.id ? "text-black/70" : "text-[var(--muted)]"}`, children: c.hint }) ] }),
      ])) }),
      errors.category && a("p", { className: "mt-2 text-[12px] text-[var(--red)]", children: errors.category }),
    ] }),
    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      p("div", { className: "flex items-center justify-between", children: [ a("label", { className: "text-[15px] font-bold", children: "Заголовок" }), p("span", { className: "text-[12px] text-[var(--muted)]", children: [v.title.length, " / 50"] }) ] }),
      a("input", { maxLength: 50, value: v.title, onChange: (e) => set("title", e.target.value), placeholder: "Например: Перевозка овощей", className: "mt-3 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
      errors.title && a("p", { className: "mt-2 text-[12px] text-[var(--red)]", children: errors.title }),
      p("div", { className: "mt-4 flex items-center justify-between", children: [ a("label", { className: "text-[15px] font-bold", children: "Описание" }), p("span", { className: `text-[12px] ${len >= 50 ? "text-[var(--green)]" : "text-[var(--muted)]"}`, children: [len, " / мин. 50"] }) ] }),
      a("textarea", { rows: 5, value: v.description, onChange: (e) => set("description", e.target.value), placeholder: "Опишите груз, маршрут, сроки...", className: "mt-3 w-full resize-none rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] leading-relaxed outline-none" }),
      errors.description && a("p", { className: "mt-2 text-[12px] text-[var(--red)]", children: errors.description }),
    ] }),
    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("h2", { className: "text-[15px] font-bold", children: "Цена" }),
      p("div", { className: "mt-3 flex gap-2", children: [
        a("button", { onClick: () => set("negotiable", false), className: `flex-1 rounded-[12px] px-3 py-3 text-[13px] font-bold ${!v.negotiable ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)] text-[var(--muted)]"}`, children: "Указать" }),
        a("button", { onClick: () => set("negotiable", true), className: `flex-1 rounded-[12px] px-3 py-3 text-[13px] font-bold ${v.negotiable ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)] text-[var(--muted)]"}`, children: "Договорная" }),
      ] }),
      !v.negotiable && a("input", { inputMode: "decimal", value: v.price, onChange: (e) => set("price", e.target.value.replace(/[^0-9.,]/g, "")), placeholder: "15000", className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
      a("div", { className: "mt-2 flex flex-wrap gap-2", children: CURRENCIES.map((c) => a("button", { key: c.id, onClick: () => set("currency", c.id), className: `rounded-full px-4 py-2.5 text-[13px] font-semibold ${v.currency === c.id && !v.negotiable ? "bg-[var(--gold)] text-black" : "bg-[var(--surface-2)] text-[var(--muted)]"}`, children: c.label })) }),
    ] }),
    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      a("h2", { className: "text-[15px] font-bold", children: "Город и контакты" }),
      a("label", { className: "mt-4 block text-[12px] text-[var(--muted)]", children: "Город" }),
      a("input", { value: v.city, onChange: (e) => set("city", e.target.value), placeholder: "Бишкек", className: "mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),
      errors.city && a("p", { className: "mt-2 text-[12px] text-[var(--red)]", children: errors.city }),
      a("label", { className: "mt-4 block text-[12px] text-[var(--muted)]", children: "Телефон" }),
      p("div", { className: "mt-2 flex items-center gap-2 rounded-[12px] bg-[var(--surface-2)] px-3 py-3.5", children: [
        a(Icon, { name: "phone", size: 14, className: "text-[var(--gold)]" }),
        a("span", { className: "text-[14px] font-semibold", children: user.phone }),
        a("span", { className: "ml-auto text-[11px] text-[var(--muted)]", children: "из профиля" }),
      ] }),
    ] }),
    a("button", { onClick: save, disabled: saving, className: "mt-5 w-full rounded-[16px] bg-[var(--gold)] py-4 text-[15px] font-bold text-black disabled:opacity-40", children: saving ? "Сохранение..." : (initial ? "Сохранить изменения" : "Опубликовать") }),
    a("button", { onClick: onCancel, className: "mt-2 w-full py-2 text-[13px] text-[var(--muted)]", children: "Отмена" }),
  ] });
}

function MarketScreen({ notify, user }) {
  const [ads, setAds] = T.useState([]);
  const [loading, setLoading] = T.useState(true);
  const [view, setView] = T.useState("list");
  const [activeId, setActiveId] = T.useState(null);
  const [editing, setEditing] = T.useState(null);

  const loadAds = async () => {
    const { data } = await supabase.from("orders")
      .select("*").eq("service_id", "market")
      .order("created_at", { ascending: false });
    if (data) {
      setAds(data.map(o => {
        const parts = (o.address || "").split(" | ");
        return {
          id: o.id, title: parts[0] || "Без названия", city: parts[1] || "",
          description: parts[2] || "", price: parts[3] || "",
          category: o.variant_id, phone: o.client_phone, whatsapp: o.client_phone,
          status: "Активно", created_at: o.created_at,
          negotiable: parts[3] === "Договорная",
          isOwn: normalizePhone(o.client_phone) === normalizePhone(user.phone),
        };
      }));
    }
    setLoading(false);
  };

  T.useEffect(() => { loadAds(); }, []);
  const active = ads.find((x) => x.id === activeId);

  const removeAd = async (id) => {
    const { error } = await supabase.from("orders").delete().eq("id", id);
    if (!error) {
      setAds((prev) => prev.filter((x) => x.id !== id));
      setView("list"); notify("Объявление удалено");
    } else notify("Ошибка: " + error.message);
  };

  if (view === "form") return a(MarketForm, { initial: editing, user, onCancel: () => { setView("list"); setEditing(null); }, onSave: () => { loadAds(); setView("list"); setEditing(null); }, notify });
  if (view === "details" && active) return a(MarketDetails, { ad: active, onBack: () => setView("list"), onEdit: (ad) => { setEditing(ad); setView("form"); }, onDelete: removeAd, notify });
  if (loading) return a("div", { className: "mt-10 flex justify-center", children: a("div", { className: "loader" }) });
  return a(MarketList, { ads, onOpen: (ad) => { setActiveId(ad.id); setView("details"); }, onAdd: () => { setEditing(null); setView("form"); } });
}

/* ============================ APP ============================ */
function App() {
  const { user, register, logout } = useAuth();
  const [tab, setTab] = T.useState("home");
  const [toast, setToast] = T.useState("");
  const [taxiOpen, setTaxiOpen] = T.useState(false);
  const [activeTaxiOrder, setActiveTaxiOrder] = T.useState(null);

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 4000); };
  const labels = { home: "Главная", taxi: "Такси", workers: "Рабочие", market: "Маркет" };

  // Глобальный realtime на активный такси-заказ клиента
  T.useEffect(() => {
    if (!user) return;
    const phone = normalizePhone(user.phone);
    const loadActive = async () => {
      const { data } = await supabase.from("orders")
        .select("*")
        .eq("client_phone", phone)
        .eq("service_id", "city_taxi")
        .not("taxi_stage", "in", "(done,cancelled)")
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();
      setActiveTaxiOrder(data || null);
    };
    loadActive();
    const ch = supabase.channel("client-taxi-" + phone)
      .on("postgres_changes",
        { event: "*", schema: "public", table: "orders", filter: `client_phone=eq.${phone}` },
        loadActive)
      .subscribe();
    return () => { supabase.removeChannel(ch); };
  }, [user?.phone]);

  if (!user) {
    return a("div", {
      className: "min-h-[100dvh] bg-[var(--bg)] text-[var(--text)]",
      style: { paddingTop: "var(--safe-area-inset-top)" },
      children: p("div", { className: "mx-auto flex min-h-[calc(100dvh-var(--safe-area-inset-top))] w-full max-w-[560px] flex-col px-4 pb-6", children: [
        a(Header, { label: "Регистрация", onBell: () => {}, user: null, onLogout: () => {} }),
        a(Toast, { text: toast, onClose: () => setToast("") }),
        a(AuthScreen, { onRegister: (data) => { register(data); notify("Добро пожаловать, " + (data.name || data.phone) + "!"); } }),
      ] }),
    });
  }

  const openTaxi = () => { setTab("taxi"); setTaxiOpen(true); };
  const closeTaxi = () => { setTaxiOpen(false); setTab("home"); };

  const renderTaxiTab = () => a(TaxiOrderScreen, {
    notify, user, activeOrder: activeTaxiOrder, setActiveOrder: setActiveTaxiOrder, onBack: closeTaxi,
  });

  return a("div", {
    className: "min-h-[100dvh] bg-[var(--bg)] text-[var(--text)]",
    style: { paddingTop: "var(--safe-area-inset-top)" },
    children: p("div", { className: "mx-auto flex min-h-[calc(100dvh-var(--safe-area-inset-top))] w-full max-w-[560px] flex-col px-4 pb-24", children: [
      a(Header, { label: labels[tab], onBell: () => notify("Уведомления появятся позже"), user, onLogout: () => { logout(); notify("Вы вышли"); } }),
      a(Toast, { text: toast, onClose: () => setToast("") }),
      a("main", { className: "flex min-w-0 flex-1 flex-col", children: [
        a("div", { role: "tabpanel", className: tab === "home" ? "flex flex-1 flex-col" : "hidden", children: a(HomeScreen, { notify, user, activeTaxiOrder, onOpenTaxi: openTaxi }) }),
        a("div", { role: "tabpanel", className: tab === "taxi" ? "flex flex-1 flex-col" : "hidden", children: renderTaxiTab() }),
        a("div", { role: "tabpanel", className: tab === "workers" ? "flex flex-1 flex-col" : "hidden", children: a(WorkersScreen, { notify, user }) }),
        a("div", { role: "tabpanel", className: tab === "market" ? "flex flex-1 flex-col" : "hidden", children: a(MarketScreen, { notify, user }) }),
      ] }),
      a(BottomNav, { tab, setTab }),
    ] }),
  });
}

createRoot(document.getElementById("root")).render(a(React.StrictMode, { children: a(App, {}) }));
</script>
