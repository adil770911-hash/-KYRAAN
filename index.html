function formatPrice(ad) {
  if (ad.negotiable) return "Договорная";
  if (!ad.price || !String(ad.price).trim()) return "Цена не указана";
  if (isNaN(String(ad.price).replace(",", ".").trim())) return ad.price;
  const num = Number(String(ad.price).replace(",", "."));
  const cur = CURRENCIES.find((c) => c.id === ad.currency);
  const symbol = cur ? cur.symbol : "сом";
  return (Number.isFinite(num) ? num.toLocaleString("ru-RU") : ad.price) + " " + symbol;
}

/* ============================ AUTH HOOK ============================ */
function useAuth() {
  const [user, setUser] = T.useState(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && isValidPhone(parsed.phone)) return parsed;
      return null;
    } catch { return null; }
  });

  const register = (data) => {
    const payload = {
      phone: normalizePhone(data.phone),
      name: (data.name || "").trim() || normalizePhone(data.phone),
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch {}
    setUser(payload);

    // --- ДОБАВЛЕНО: Отправка клиента в базу при регистрации ---
    supabase.from('orders').insert([{
      client_phone: payload.phone,
      service_id: 'registration',
      hunter: 'CLIENT',
      status: 'REGISTERED',
      address: payload.name 
    }]).then(({ error }) => {
        if (error) console.error('Ошибка сохранения клиента:', error.message);
    });
    // -----------------------------------------------------------
  };

  const logout = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    setUser(null);
  };

  return { user, register, logout };
}

  const [workers, setWorkers] = T.useState([]);

  const skill = form.skill === "Другое" ? form.skillOther.trim() : form.skill.trim();

  const loadWorkers = async () => {
    const { data } = await supabase.from("orders")
      .select("*")
      .eq("service_id", "workers")
      .order("created_at", { ascending: false });

    if (data) {
      setWorkers(data.map(o => {
        const parts = (o.address || "").split(" | ");
        return {
          id: o.id,
          name: parts[0] || "Без имени",
          city: parts[1] || "",
          skill: o.variant_id,
          kind: o.variant_id,
          phone: o.client_phone,
        };
      }));
    }
    setLoading(false);
  };

  T.useEffect(() => { loadWorkers(); }, []);

  const submit = async () => {
    const err = {};
    if (!form.name.trim()) err.name = "Укажите имя";
    if (!skill) err.skill = "Выберите навык";
    setErrors(err);
    if (Object.keys(err).length) return;

    setSubmitting(true);
    const { error } = await supabase.from("orders").insert([{
      service_id: "workers",
      variant_id: skill,
      client_phone: normalizePhone(user.phone),
      address: `${form.name.trim()} | ${form.city.trim() || "Город не указан"}`,
      hunter: "BOARD",
      status: "NEW",

      return;

function MarketForm({ initial, user, onCancel, onSave, notify }) {
  const [v, setV] = T.useState({
    category: initial?.category || "",
    title: initial?.title || "",
    description: initial?.description || "",
    price: initial && !initial.negotiable ? cleanPriceForInput(initial.price) : "",
    currency: initial?.currency || "som",
    negotiable: initial?.negotiable || false,
    city: initial?.city || "",
  });
  const [errors, setErrors] = T.useState({});
  const [saving, setSaving] = T.useState(false);

  const len = v.description.trim().length;
  const set = (key, val) => setV((prev) => ({ ...prev, [key]: val }));

  const save = async () => {
    const e = {};
    if (!v.category) e.category = "Выберите категорию";
    if (!v.title.trim()) e.title = "Добавьте заголовок";
    if (len < 50) e.description = "Нужно ещё " + Math.max(0, 50 - len) + " симв.";
    if (!v.city.trim()) e.city = "Укажите город";
    setErrors(e);
    if (Object.keys(e).length) return;

    setSaving(true);
    const priceStr = v.negotiable
      ? "Договорная"
      : v.price
        ? v.price + " " + (CURRENCIES.find(c => c.id === v.currency)?.label || "сом")
        : "Не указана";
    const addressStr = `${v.title.trim()} | ${v.city.trim()} | ${v.description.trim()} | ${priceStr}`;

    const payload = {
      service_id: "market",
      variant_id: v.category,
      client_phone: normalizePhone(user.phone),
      address: addressStr,
      hunter: "BOARD",
      status: "NEW",
    };

    let error = null;
    if (initial?.id) {
      const res = await supabase.from("orders").update(payload).eq("id", initial.id);
      error = res.error;
    } else {
      const res = await supabase.from("orders").insert([payload]);
      error = res.error;
    }
    setSaving(false);

    if (error) {
      notify("Ошибка сохранения: " + error.message);
    } else {
      onSave();
    }
  };

  return p("div", { className: "flex flex-1 flex-col pb-4", children: [
    p("button", { type: "button", onClick: onCancel, className: "flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]", children: [a(Icon, { name: "arrowLeft", size: 17 }), " Назад"] }),

      a("h2", { className: "text-[15px] font-bold", children: "Категория" }),

        a("span", { className: `flex h-10 w-10 shrink-0 items-center justify-center rounded-full ${v.category === c.id ? "bg-black/15" : "bg-[var(--surface)]"}`, children: a(Icon, { name: c.icon, size: 18 }) }),
        p("span", { className: "min-w-0", children: [ a("span", { className: "block text-[14px] font-bold leading-snug", children: c.short }), a("span", { className: `block text-[12px] ${v.category === c.id ? "text-black/70" : "text-[var(--muted)]"}`, children: c.hint }) ] }),
      ] }, c.id)) }),
      errors.category && a("p", { className: "mt-2 text-[12px] text-[var(--red)]", children: errors.category }),
    ] }),
    p("section", { className: "mt-3 rounded-[16px] bg-[var(--surface)] p-4", children: [
      p("div", { className: "flex items-center justify-between", children: [ a("label", { className: "text-[15px] font-bold", children: "Заголовок" }), p("span", { className: "text-[12px] text-[var(--muted)]", children: [v.title.length, " / 50"] }) ] }),
      a("input", { maxLength: 50, value: v.title, onChange: (e) => set("title", e.target.value), placeholder: "Например: Перевозка овощей", className: "mt-3 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none" }),

function MarketScreen({ notify, user }) {
  const [ads, setAds] = T.useState([]);
  const [loading, setLoading] = T.useState(true);
  const [view, setView] = T.useState("list");
  const [activeId, setActiveId] = T.useState(null);
  const [editing, setEditing] = T.useState(null);

  const loadAds = async () => {
    const { data } = await supabase.from("orders")
      .select("*")
      .eq("service_id", "market")
      .order("created_at", { ascending: false });

    if (data) {
      setAds(data.map(o => {
        const parts = (o.address || "").split(" | ");
        return {
          id: o.id,
          title: parts[0] || "Без названия",
          city: parts[1] || "",
          description: parts[2] || "",
          price: parts[3] || "",
          category: o.variant_id,
          phone: o.client_phone,
          whatsapp: o.client_phone,
          status: "Активно",
          created_at: o.created_at,
          negotiable: parts[3] === "Договорная",
          isOwn: normalizePhone(o.client_phone) === normalizePhone(user.phone),
        };
      }));
    }
    setLoading(false);
  };

  T.useEffect(() => { loadAds(); }, []);

  const active = ads.find((x) => x.id === activeId);

  const removeAd = async (id) => {
    const { error } = await supabase.from("orders").delete().eq("id", id);
    if (!error) {
      setAds((prev) => prev.filter((x) => x.id !== id));
      setView("list");
      notify("Объявление удалено");
    } else {
      notify("Ошибка удаления: " + error.message);
    }
  };

  if (view === "form") {
    return a(MarketForm, { initial: editing, user, onCancel: () => { setView("list"); setEditing(null); }, onSave: () => { loadAds(); setView("list"); setEditing(null); }, notify });
  }

  if (view === "details" && active) {
    return a(MarketDetails, { ad: active, onBack: () => setView("list"), onEdit: (ad) => { setEditing(ad); setView("form"); }, onDelete: removeAd, notify });
  }

  if (loading) return a("div", { className: "mt-10 flex justify-center", children: a("div", { className: "loader" }) });

  return a(MarketList, { ads, onOpen: (ad) => { setActiveId(ad.id); setView("details"); }, onAdd: () => { setEditing(null); setView("form"); } });
}
