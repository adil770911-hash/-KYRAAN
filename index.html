/* Submarine radar card — pure CSS animation */

@keyframes radar-sweep{
  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }
}

@keyframes radar-pulse{
  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.65);
    opacity:.45;
  }
}

@keyframes radar-blip{
  0%,100%{
    opacity:.35;
    transform:scale(.85);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

.radar-card{
  background:radial-gradient(circle at 50% 18%, rgba(43,212,107,.22), rgba(2,18,10,.98) 58%), #02100a;
  border:2px solid rgba(43,212,107,.72);
  box-shadow:0 0 0 1px rgba(43,212,107,.18), 0 0 34px rgba(43,212,107,.32), inset 0 0 30px rgba(43,212,107,.14);
}

.radar-scope{
  background:radial-gradient(circle, rgba(43,212,107,.18) 0%, rgba(0,28,14,.95) 62%, #010805 100%);
  border:2px solid #2bd46b;
  box-shadow:0 0 28px rgba(43,212,107,.48), inset 0 0 22px rgba(43,212,107,.22);
}

.radar-ring{
  border:1.5px solid rgba(43,212,107,.52);
}

.radar-ring-2{
  border:1.5px solid rgba(43,212,107,.34);
}

.radar-ring-3{
  border:1px solid rgba(43,212,107,.22);
}

.radar-sweep{
  background:conic-gradient(from 0deg, rgba(43,212,107,.88) 0deg, rgba(43,212,107,.28) 58deg, transparent 78deg);
  animation:radar-sweep 3.2s linear infinite;
}

.radar-center{
  animation:radar-pulse 1.8s ease-in-out infinite;
}

.radar-blip{
  animation:radar-blip 1.8s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce){
  .radar-sweep,.radar-center,.radar-blip{
    animation:none;
  }
}
