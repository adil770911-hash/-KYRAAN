<style>
:root{
  --bg:#0A0A0A;--surface:#1E1E1E;--surface-2:#2A2A2A;
  --text:#F5F3EF;--muted:#9B9B9B;
  --gold:#E8B84B;--gold-soft:#2A2415;
  --green:#2BD46B;--green-soft:#15281D;--red:#FF6B6B;
  --safe-area-inset-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
input,textarea,select{font:inherit}
input:focus,textarea:focus{outline:2px solid rgba(232,184,75,.55)}
.loader{border:3px solid var(--surface-2);border-top:3px solid var(--gold);border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes radar-sweep{to{transform:rotate(360deg)}}
@keyframes radar-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.65);opacity:.45}}
@keyframes radar-blip{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pulse-soft{0%,100%{opacity:1}50%{opacity:.6}}
.radar-card{background:radial-gradient(circle at 50% 18%,rgba(43,212,107,.22),rgba(2,18,10,.98) 58%),#02100a;border:2px solid rgba(43,212,107,.72);box-shadow:0 0 34px rgba(43,212,107,.32)}
.radar-scope{background:radial-gradient(circle,rgba(43,212,107,.18) 0%,rgba(0,28,14,.95) 62%,#010805 100%);border:2px solid #2bd46b;box-shadow:0 0 28px rgba(43,212,107,.48)}
.radar-ring{border:1.5px solid rgba(43,212,107,.52)}
.radar-ring-2{border:1.5px solid rgba(43,212,107,.34)}
.radar-ring-3{border:1px solid rgba(43,212,107,.22)}
.radar-sweep{background:conic-gradient(from 0deg,rgba(43,212,107,.88) 0deg,rgba(43,212,107,.28) 58deg,transparent 78deg);animation:radar-sweep 3.2s linear infinite}
.radar-center{animation:radar-pulse 1.8s ease-in-out infinite}
.radar-blip{animation:radar-blip 1.8s ease-in-out infinite}
.pulse-soft{animation:pulse-soft 1.6s ease-in-out infinite}
.clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{scrollbar-width:none}
.map-picker-box{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column}
.map-picker-box .leaflet-container{flex:1;border-radius:0}
#boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
</style>
</head>

<div id="root">
  <div id="boot-loader">
    <div>
      <div style="font-size:36px;font-weight:900;color:#E8B84B;margin-bottom:14px">K</div>
      <div id="boot-msg" style="font-size:14px;color:#9B9B9B">Загрузка...</div>
    </div>
  </div>

<script>
function showBootError(msg){
  var el=document.getElementById('boot-msg');
  if(el) el.innerHTML='⚠️ '+msg+'<br><br><button onclick="location.reload()" style="padding:12px 24px;background:#E8B84B;color:#000;border:0;border-radius:10px;font-weight:bold;font-size:14px">Обновить</button>';
}
window.addEventListener('error',function(e){showBootError(e.message||'Ошибка сети');});
window.addEventListener('unhandledrejection',function(e){showBootError((e.reason&&e.reason.message)||'Ошибка');});
setTimeout(function(){
  var el=document.getElementById('boot-msg');
  if(el&&el.textContent==='Загрузка...') showBootError('Долго грузится. Проверьте интернет.');
},9000);
if(!window.React||!window.ReactDOM||!window.supabase){
  showBootError('Не загрузились библиотеки. Проверьте интернет.');
}else{
  startApp();
}

    var t=TAXI_TARIFFS[id]||TAXI_TARIFFS.econom;
    var raw=t.base+(Number(km)||0)*t.perKm;
    return Math.max(t.min,Math.round(raw/10)*10);

  function formatPrice(ad){
    if(ad.negotiable)return'Договорная';
    if(!ad.price)return'Цена не указана';
    var cur=CURRENCIES.filter(function(c){return c.id===ad.currency;})[0];

  }

  }

  /* ===================== AUTH HOOK ===================== */
  function useAuth(){
    var u=T.useState(function(){
      try{
        var raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;
        var parsed=JSON.parse(raw);
        if(parsed&&isValidPhone(parsed.phone))return parsed;
        return null;
      }catch(e){return null;}
    });
    var user=u[0],setUser=u[1];
    function register(data){
      var payload={phone:normalizePhone(data.phone),name:(data.name||'').trim()||normalizePhone(data.phone)};
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}catch(e){}
      setUser(payload);
      supabase.from('orders').insert([{
        client_phone:payload.phone,service_id:'registration',
        hunter:'CLIENT',status:'REGISTERED',address:payload.name
      }]).then(function(r){if(r.error)console.error(r.error.message);});
    }
    function logout(){
      try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
      setUser(null);
    }
    return{user:user,register:register,logout:logout};
  }

      var center=props.initial?[props.initial.lat,props.initial.lng]:[42.8746,74.5698];

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM',maxZoom:19}).addTo(map);
      var marker=props.initial?L.marker(center).addTo(map):null;

        props.onPick({lat:lat,lng:lng});
      });
      return function(){map.remove();};
    },[]);
    return p('div',{className:'map-picker-box'},[
      p('div',{className:'flex items-center justify-between bg-[var(--surface)] p-3'},[

    var s4=T.useState(null);var route=s4[0],setRoute=s4[1];
    var s5=T.useState(false);var calcLoading=s5[0],setCalcLoading=s5[1];
    var s6=T.useState(null);var picker=s6[0],setPicker=s6[1];
    var s7=T.useState(false);var sending=s7[0],setSending=s7[1];
    var s8=T.useState('');var error=s8[0],setError=s8[1];

    T.useEffect(function(){
      if(!pointA||!pointB){setRoute(null);return;}
      setCalcLoading(true);
      calcRouteDistance(pointA.lat,pointA.lng,pointB.lat,pointB.lng).then(function(r){
        setRoute(r);setCalcLoading(false);
      });
    },[pointA,pointB]);

    function pickFromGPS(){
      if(!navigator.geolocation){props.notify('Геолокация недоступна');return;}
      props.notify('Получаем GPS...');
      navigator.geolocation.getCurrentPosition(function(pos){
        var lat=pos.coords.latitude,lng=pos.coords.longitude;
        reverseGeocode(lat,lng).then(function(addr){
          setPointA({lat:lat,lng:lng,address:addr});
        });
      },function(){props.notify('Разрешите геолокацию');},{enableHighAccuracy:true,timeout:10000});
    }
    function onMapPick(target){
      return function(c){
        reverseGeocode(c.lat,c.lng).then(function(addr){
          if(target==='A')setPointA({lat:c.lat,lng:c.lng,address:addr});
          else setPointB({lat:c.lat,lng:c.lng,address:addr});
          setPicker(null);
        });
      };
    }

    var price=route?calcTaxiPrice(route.km,tariff):null;

    function submit(){
      if(!pointA||!pointB){setError('Укажите А и Б');return;}
      if(!route){setError('Маршрут считается');return;}
      setSending(true);
      supabase.from('orders').insert([{
        client_phone:normalizePhone(props.user.phone),
        service_id:'city_taxi',hunter:'HUNTER_01',status:'NEW',taxi_stage:'searching',
        address:joinAddress(pointA.address,pointB.address),
        pickup_lat:pointA.lat,pickup_lng:pointA.lng,
        drop_lat:pointB.lat,drop_lng:pointB.lng,
        distance_km:route.km,price_som:price,taxi_tariff:tariff,
        variant_id:TAXI_TARIFFS[tariff].label

        setSending(false);

        props.setActiveOrder(res.data);

      });

      if(!props.activeOrder)return;

        props.setActiveOrder(null);props.notify('Отменено');
      });
    }

    if(props.activeOrder){
      var stage=props.activeOrder.taxi_stage||'searching';
      var stageIcon={searching:'🔍',assigned:'🚕',arrived:'📍',riding:'🛣',done:'🏁',cancelled:'✖'}[stage]||'🚖';

        a('input',{value:v.city,onChange:function(e){set('city',e.target.value);},placeholder:'Бишкек',className:'mt-2 w-full rounded-[12px] bg-[var(--surface-2)] p-3.5 text-[14px] outline-none'}),
        errors.city&&a('p',{className:'mt-2 text-[12px] text-[var(--red)]'},errors.city),
        p('div',{className:'mt-3 flex items-center gap-2 rounded-[12px] bg-[var(--surface-2)] px-3 py-3.5'},[
          a(Icon,{name:'phone',size:14,className:'text-[var(--gold)]'}),
          a('span',{className:'text-[14px] font-semibold'},props.user.phone),
          a('span',{className:'ml-auto text-[11px] text-[var(--muted)]'},'из профиля')
        ])
      ]),
      a('button',{onClick:save,disabled:saving,className:'mt-5 w-full rounded-[16px] bg-[var(--gold)] py-4 text-[15px] font-bold text-black disabled:opacity-40'},saving?'Сохранение...':(props.initial?'Сохранить':'Опубликовать')),
      a('button',{onClick:props.onCancel,className:'mt-2 w-full py-2 text-[13px] text-[var(--muted)]'},'Отмена')
    ]);
  }

  function MarketDetails(props){
    var ad=props.ad;var cat=categoryById(ad.category);
    var s=T.useState(false);var confirmDelete=s[0],setConfirmDelete=s[1];
    return p('div',{className:'flex flex-1 flex-col pb-4'},[
      p('button',{onClick:props.onBack,className:'flex w-fit items-center gap-2 text-[13px] font-semibold text-[var(--muted)]'},[a(Icon,{name:'arrowLeft',size:17}),' Назад']),
      p('section',{className:'mt-4 rounded-[16px] bg-[var(--surface)] p-4'},[
        p('div',{className:'flex items-start gap-3'},[
          a('div',{className:'flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-[var(--surface-2)]'},a(Icon,{name:cat.icon,size:24,className:'text-[var(--gold)]'})),
          p('div',{className:'min-w-0'},[
            a('h1',{className:'text-[21px] font-extrabold'},ad.title),
            a('p',{className:'mt-2 text-[14px] font-bold text-[var(--gold)]'},formatPrice(ad))
          ])
        ])
      ]),
      p('section',{className:'mt-3 rounded-[16px] bg-[var(--surface)] p-4'},[
        a('h2',{className:'text-[15px] font-bold'},'Связаться'),
        p('div',{className:'mt-3 grid grid-cols-2 gap-2'},[
          a('a',{href:waHref(ad.whatsapp),target:'_blank',className:'flex items-center justify-center gap-2 rounded-[12px] bg-[var(--green)] py-3.5 text-[14px] font-bold text-black'},[a(Icon,{name:'messageCircle',size:17}),' WhatsApp']),
          a('a',{href:telHref(ad.phone),className:'flex items-center justify-center gap-2 rounded-[12px] bg-[var(--gold)] py-3.5 text-[14px] font-bold text-black'},[a(Icon,{name:'phone',size:17}),' Позвонить'])
        ])
      ]),
      p('section',{className:'mt-3 rounded-[16px] bg-[var(--surface)] p-4'},[
        a('h2',{className:'text-[15px] font-bold'},'Описание'),
        a('p',{className:'mt-3 whitespace-pre-wrap text-[14px] leading-relaxed'},ad.description)
      ]),
      ad.isOwn&&p('section',{className:'mt-3 rounded-[16px] bg-[var(--surface)] p-4'},[
        a('h2',{className:'text-[15px] font-bold'},'Действия'),
        p('div',{className:'mt-3 flex flex-col gap-2'},[
          p('button',{onClick:function(){props.onEdit(ad);},className:'flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold'},[a(Icon,{name:'pencil',size:16}),' Редактировать']),
          !confirmDelete?p('button',{onClick:function(){setConfirmDelete(true);},className:'flex w-full items-center justify-center gap-2 rounded-[12px] bg-[var(--surface-2)] py-3.5 text-[14px] font-semibold text-[var(--red)]'},[a(Icon,{name:'trash2',size:16}),' Удалить']):
          p('div',{className:'rounded-[12px] bg-[var(--surface-2)] p-3'},[
            a('p',{className:'text-[13px] font-semibold text-[var(--red)]'},'Удалить безвозвратно?'),
            p('div',{className:'mt-3 grid grid-cols-2 gap-2'},[
              a('button',{onClick:function(){props.onDelete(ad.id);},className:'rounded-[10px] bg-[var(--red)] py-2.5 text-[13px] font-bold text-black'},'Удалить'),
              a('button',{onClick:function(){setConfirmDelete(false);},className:'rounded-[10px] bg-[var(--surface)] py-2.5 text-[13px] font-semibold'},'Отмена')
            ])
          ])
        ])
      ])
    ]);
  }

  function MarketScreen(props){
    var s1=T.useState([]);var ads=s1[0],setAds=s1[1];
    var s2=T.useState(true);var loading=s2[0],setLoading=s2[1];
    var s3=T.useState('list');var view=s3[0],setView=s3[1];
    var s4=T.useState(null);var activeId=s4[0],setActiveId=s4[1];
    var s5=T.useState(null);var editing=s5[0],setEditing=s5[1];

    function loadAds(){
      supabase.from('orders').select('*').eq('service_id','market').order('created_at',{ascending:false}).then(function(r){
        if(r.data){
          setAds(r.data.map(function(o){
            var parts=(o.address||'').split(' | ');
            return{
              id:o.id,title:parts[0]||'Без названия',city:parts[1]||'',
              description:parts[2]||'',price:parts[3]||'',
              category:o.variant_id,phone:o.client_phone,whatsapp:o.client_phone,
              status:'Активно',created_at:o.created_at,
              negotiable:parts[3]==='Договорная',
              isOwn:normalizePhone(o.client_phone)===normalizePhone(props.user.phone)
            };
          }));
        }
        setLoading(false);
      });
    }
    T.useEffect(function(){loadAds();},[]);
    var active=ads.filter(function(x){return x.id===activeId;})[0];

    function removeAd(id){
      supabase.from('orders').delete().eq('id',id).then(function(r){
        if(!r.error){setAds(ads.filter(function(x){return x.id!==id;}));setView('list');props.notify('Удалено');}
        else props.notify('Ошибка: '+r.error.message);
      });
    }

    if(view==='form')return a(MarketForm,{initial:editing,user:props.user,
      onCancel:function(){setView('list');setEditing(null);},
      onSave:function(){loadAds();setView('list');setEditing(null);},
      notify:props.notify});
    if(view==='details'&&active)return a(MarketDetails,{ad:active,onBack:function(){setView('list');},
      onEdit:function(ad){setEditing(ad);setView('form');},onDelete:removeAd,notify:props.notify});
    if(loading)return a('div',{className:'mt-10 flex justify-center'},a('div',{className:'loader'}));
    return a(MarketList,{ads:ads,onOpen:function(ad){setActiveId(ad.id);setView('details');},
      onAdd:function(){setEditing(null);setView('form');}});
  }

  /* ===================== APP ===================== */
  function App(){
    var auth=useAuth();
    var s1=T.useState('home');var tab=s1[0],setTab=s1[1];
    var s2=T.useState('');var toast=s2[0],setToast=s2[1];
    var s3=T.useState(null);var activeTaxiOrder=s3[0],setActiveTaxiOrder=s3[1];
    var notify=function(msg){setToast(msg);setTimeout(function(){setToast('');},4000);};
    var labels={home:'Главная',taxi:'Такси',workers:'Рабочие',market:'Маркет'};

    T.useEffect(function(){
      if(!auth.user)return;
      var phone=normalizePhone(auth.user.phone);
      function loadActive(){
        supabase.from('orders').select('*')
          .eq('client_phone',phone)
          .eq('service_id','city_taxi')
          .not('taxi_stage','in','(done,cancelled)')
          .order('created_at',{ascending:false})
          .limit(1).maybeSingle().then(function(r){
            setActiveTaxiOrder(r.data||null);
          });
      }
      loadActive();
      var ch=supabase.channel('client-taxi-'+phone)
        .on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:'client_phone=eq.'+phone},loadActive)
        .subscribe();
      return function(){supabase.removeChannel(ch);};
    },[auth.user&&auth.user.phone]);

    if(!auth.user){
      return a('div',{className:'min-h-[100dvh] bg-[var(--bg)] text-[var(--text)]',style:{paddingTop:'var(--safe-area-inset-top)'}},[
        p('div',{key:'c',className:'mx-auto flex min-h-[calc(100dvh-var(--safe-area-inset-top))] w-full max-w-[560px] flex-col px-4 pb-6'},[
          a(Header,{label:'Регистрация',onBell:function(){},user:null,onLogout:function(){}}),
          a(Toast,{text:toast,onClose:function(){setToast('');}}),
          a(AuthScreen,{onRegister:function(data){auth.register(data);notify('Добро пожаловать!');}})
        ])
      ]);
    }

    function openTaxi(){setTab('taxi');}
    function closeTaxi(){setTab('home');}

    return a('div',{className:'min-h-[100dvh] bg-[var(--bg)] text-[var(--text)]',style:{paddingTop:'var(--safe-area-inset-top)'}},[
      p('div',{key:'c',className:'mx-auto flex min-h-[calc(100dvh-var(--safe-area-inset-top))] w-full max-w-[560px] flex-col px-4 pb-24'},[
        a(Header,{label:labels[tab],onBell:function(){notify('Уведомления позже');},user:auth.user,onLogout:function(){auth.logout();notify('Вы вышли');}}),
        a(Toast,{text:toast,onClose:function(){setToast('');}}),
        a('main',{className:'flex min-w-0 flex-1 flex-col'},[
          a('div',{key:'home',style:{display:tab==='home'?'flex':'none'},className:'flex-1 flex-col'},a(HomeScreen,{notify:notify,user:auth.user,activeTaxiOrder:activeTaxiOrder,onOpenTaxi:openTaxi})),
          a('div',{key:'taxi',style:{display:tab==='taxi'?'flex':'none'},className:'flex-1 flex-col'},a(TaxiOrderScreen,{notify:notify,user:auth.user,activeOrder:activeTaxiOrder,setActiveOrder:setActiveTaxiOrder,onBack:closeTaxi})),
          a('div',{key:'workers',style:{display:tab==='workers'?'flex':'none'},className:'flex-1 flex-col'},a(WorkersScreen,{notify:notify,user:auth.user})),
          a('div',{key:'market',style:{display:tab==='market'?'flex':'none'},className:'flex-1 flex-col'},a(MarketScreen,{notify:notify,user:auth.user}))
        ]),
        a(BottomNav,{tab:tab,setTab:setTab})
      ])
    ]);
  }

  var rootEl=document.getElementById('root');
  rootEl.innerHTML='';
  createRoot(rootEl).render(a(React.StrictMode,{},a(App,{})));
}
</script>
</body>
